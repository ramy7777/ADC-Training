<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADC POC — Web Prototype</title>
<!-- Internal evaluation prototype. Admin PIN: 2026 -->
<style>
:root{--navy:#0C2340;--navy2:#16355c;--gold:#C2992F;--soft:#F5F8FC;--muted:#5B6472;
--green:#1F9D6B;--red:#B42318;--amber:#FDF6E7;--border:#d9e1ec}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Tahoma,sans-serif;background:var(--soft);color:#1a2432;min-height:100vh}
header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:17px;font-weight:600}
header .tag{font-size:11px;background:var(--gold);color:#fff;border-radius:4px;padding:2px 8px}
header .spacer{flex:1}
button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;font-size:14px}
.btn{background:var(--navy);color:#fff;padding:10px 20px}
.btn:hover{background:var(--navy2)}
.btn.gold{background:var(--gold)}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);padding:7px 14px;font-size:12.5px}
.btn.small{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
main{max-width:960px;margin:26px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(12,35,64,.06)}
.eyebrow{color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
h2{color:var(--navy);font-size:20px;margin-bottom:10px}
h3{color:var(--navy);font-size:15px;margin-bottom:8px}
label{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px}
input[type=text],input[type=password]{width:100%;max-width:340px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit}
.langrow{display:flex;gap:10px;margin:6px 0 14px}
.langbtn{padding:9px 22px;border:1.5px solid var(--border);background:#fff;border-radius:8px;font-size:14px}
.langbtn.sel{border-color:var(--navy);background:var(--navy);color:#fff}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.level{border:1.5px solid var(--border);border-radius:10px;padding:14px;text-align:center;background:#fff}
.level .num{font-size:22px;font-weight:700;color:var(--navy)}
.level .st{font-size:12px;color:var(--muted);margin-top:4px}
.level.open{border-color:var(--green);cursor:pointer}
.level.open:hover{background:#f2fbf7}
.level.locked{opacity:.55}
.level.bypassed{border-color:var(--gold)}
.hud{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:14px}
.hud b{color:var(--navy);font-size:15px}
.hud .pill{background:#fff;border:1px solid var(--border);border-radius:99px;padding:6px 14px}
.scene{background:var(--amber);border-radius:8px;padding:10px 14px;font-size:12.5px;color:#5a4a1c;margin-bottom:14px}
.scene b{color:var(--navy)}
.prompt{font-size:16.5px;color:var(--navy);font-weight:600;margin-bottom:14px;line-height:1.5}
.opts{display:grid;gap:9px}
.opt{border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:12px 15px;font-size:14px;text-align:start;line-height:1.45;transition:border-color .12s}
.opt:hover{border-color:var(--navy)}
.opt.sel{border-color:var(--gold);background:#fdf9ef;box-shadow:0 0 0 1px var(--gold)}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.zone{border:1.5px dashed var(--border);border-radius:10px;padding:10px;min-height:74px;background:#fbfdff}
.zone.target{border-color:var(--gold);background:#fdf9ef}
.zone h4{font-size:12.5px;color:var(--navy);margin-bottom:6px}
.chip{display:inline-block;background:var(--navy);color:#fff;border-radius:6px;padding:5px 10px;font-size:12.5px;margin:3px;cursor:pointer}
.seq{margin-top:10px;font-size:13px;color:var(--muted)}
.seq .chip{background:var(--gold)}
.feedback{margin-top:14px;font-weight:700;font-size:15px;min-height:22px}
.feedback.ok{color:var(--green)}.feedback.no{color:var(--red)}
.actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.big{font-size:42px;font-weight:800;color:var(--navy)}
.pass{color:var(--green)}.fail{color:var(--red)}
.bar{height:8px;background:#e7edf5;border-radius:99px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--gold)}
table{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:10px}
th{background:var(--navy);color:#fff;padding:7px 9px;text-align:start;font-weight:600}
td{border:1px solid var(--border);padding:6px 9px;vertical-align:top}
tr:nth-child(even) td{background:var(--soft)}
.drawer{position:fixed;top:0;inset-inline-end:0;width:min(430px,95vw);height:100vh;background:#fff;border-inline-start:1px solid var(--border);box-shadow:-6px 0 24px rgba(12,35,64,.15);transform:translateX(105%);transition:transform .25s;z-index:50;display:flex;flex-direction:column}
[dir=rtl] .drawer{transform:translateX(-105%)}
.drawer.open{transform:translateX(0)!important}
.drawer .dhead{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px}
.drawer .dbody{padding:16px 18px;overflow-y:auto;flex:1;font-size:13px}
.loglines{font-size:12px;color:var(--muted);max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:8px;margin-top:6px}
.notice{font-size:11.5px;color:var(--muted);background:#eef3fa;border-radius:8px;padding:8px 12px;margin-top:14px}
.review .q{border-inline-start:3px solid var(--gold);padding:8px 12px;margin:10px 0;background:#fff;border-radius:0 8px 8px 0}
.review .q .qp{font-weight:600;color:var(--navy);font-size:13.5px}
.review .q .qa{font-size:12.5px;margin-top:4px}
.review .q .qa.c{color:var(--green)}.review .q .qa.d{color:var(--muted)}
.badge{font-size:10.5px;border-radius:4px;padding:1px 6px;background:var(--navy);color:#fff;vertical-align:middle}
footer{max-width:960px;margin:10px auto 30px;padding:0 16px;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1 id="hTitle">ADC VR Training POC — Web Prototype</h1>
  <span class="tag" id="hTag">EVALUATION</span>
  <span class="spacer"></span>
  <button class="btn ghost" id="btnReview">Review content</button>
  <button class="btn ghost" id="btnAdmin">Admin</button>
</header>
<main id="app"></main>
<footer id="foot"></footer>

<div class="drawer" id="drawer">
  <div class="dhead"><b style="flex:1" id="dTitle">Admin</b>
    <button class="btn ghost small" id="dClose">✕</button></div>
  <div class="dbody" id="dBody"></div>
</div>

  backHome:"عودة إلى المستويات",l2unlocked:"فُتح المستوى ٢ بواسطة المشرف",l2locked:"مقفل — اجتز المستوى ١ أولاً. يمكن للمشرف الفتح استثنائياً.",
  l2content:"محتوى المستوى ٢ ضمن نطاق المشروع — هذه الشاشة تثبت القفل وصلاحية المشرف فقط.",
  admin:"لوحة المشرف",pin:"الرقم السري للمشرف",adminName:"اسم المشرف",unlock:"فتح استثنائي: المستوى ٢",unlocked:"المستوى ٢ مفتوح",
  wrongPin:"رقم سري خاطئ",results:"نتائج الجلسات",csv:"تصدير CSV",noresults:"لا توجد محاولات بعد",
  live:"الجلسة المباشرة",none:"—",review:"مراجعة المحتوى — الأسئلة الـ٣٦ كاملة",reviewNote:"★ = نموذج الاثنين للعميل. المحرك يسحب ٤ من ٦ لكل مهارة في كل محاولة (٢٤ سؤالاً).",
  correctLbl:"الصحيح:",distLbl:"المشتتات:",close:"إغلاق",scene:"المشهد",
  arDraft:"المحتوى العربي ترجمة أولية بانتظار المراجعة البشرية (الثلاثاء حسب الخطة).",
  foot:"استوديوهات العوالم الافتراضية — نموذج تقييم داخلي. نفس ملف المحتوى وقواعد المحرك في نسخة الواقع الافتراضي: ٢٤ من ٣٦، ٥ علامات، النجاح ٩٦/١٢٠، ٥ محاولات بأسئلة مختلفة، قفل المستويات مع فتح استثنائي مسجّل.",
  welcome:name=>`أهلاً ${name}. سيرافقك الموجّه عبر ست محطات.`}
};
const T = k=>UI[LANG][k];
const L = o=>(LANG==="ar"&&o.ar)?o.ar:o.en;

// ---------- persistent state ----------
const store = {
 get(){try{return JSON.parse(localStorage.getItem("adc_poc")||"{}")}catch(e){return{}}},
 set(d){localStorage.setItem("adc_poc",JSON.stringify(d))}
};
let DB = Object.assign({results:[],log:[],bypass:null},store.get());
function save(){store.set(DB)}

// ---------- seeded rng ----------
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function hash(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function shuffled(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// combinations of [0..5] choose 4
const COMBOS=[];
for(let a=0;a<6;a++)for(let b=a+1;b<6;b++)for(let c=b+1;c<6;c++)for(let d=c+1;d<6;d++)COMBOS.push([a,b,c,d]);

// ---------- session ----------
let S=null; // {trainee, seed, attempt, qlist, idx, score, answers, active}
function draw(attempt){
 const qs=[];
 for(const sk of CONTENT.skills){
   const r=rng(S.seed+sk.id*7919);
   const order=shuffled(COMBOS,r)[(attempt-1)%COMBOS.length];
   const rq=rng(S.seed+sk.id*104729+attempt*31);
   const picked=shuffled(order.map(i=>sk.questions[i]),rq);
   picked.forEach(q=>qs.push({q,sk}));
 }
 return qs;
}
function resolveWidget(q){
 const hasArrow=q.correct.some(c=>c.en.includes("→"));
 if(q.template==="T2"&&hasArrow)return"assign";
 if(q.template==="T4"&&q.ordered)return"sequence";
 if(q.template==="T3")return"single";
 return q.correct.length>1?"multi":"single";
}
function realDistractors(q){return q.distractors.filter(d=>!d.en.trim().startsWith("("))}

// ---------- views ----------
const app=document.getElementById("app");
function setLangUI(){
 document.documentElement.lang=LANG;
 document.documentElement.dir=LANG==="ar"?"rtl":"ltr";
 document.getElementById("hTitle").textContent=T("title");
 document.getElementById("hTag").textContent=T("tag");
 document.getElementById("btnReview").textContent=T("review").split(" — ")[0];
 document.getElementById("btnAdmin").textContent=T("admin").split(" ")[0]==="Admin"?"Admin":"المشرف";
 document.getElementById("foot").textContent=T("foot");
}
function levelState(n){
 if(n===1)return"open";
 const passed=DB.results.some(r=>r.pass&&r.level===1);
 if(n===2&&(passed||DB.bypass))return DB.bypass&&!passed?"bypassed":"open";
 return"locked";
}
function viewStart(){
 S=null;
 const name=(DB.lastName||"");
 app.innerHTML=`
 <div class="card">
  <div class="eyebrow">${T("module")}${L(CONTENT.module.name)}</div>
  <h2>${T("start")}</h2>
  <label>${T("trainee")}</label><input id="inName" type="text" value="${name.replace(/"/g,"&quot;")}">
  <label>${T("lang")}</label>
  <div class="langrow">
    <button class="langbtn ${LANG==="en"?"sel":""}" data-l="en">English</button>
    <button class="langbtn ${LANG==="ar"?"sel":""}" data-l="ar">العربية</button>
  </div>
  <h3>${T("level")}s</h3>
  <div class="levels">${[1,2,3,4,5].map(n=>{
    const st=levelState(n);
    return`<div class="level ${st==="locked"?"locked":st}" data-lv="${n}">
      <div class="num">${n}</div>
      <div class="st">${st==="locked"?"🔒 "+T("locked"):(st==="bypassed"?"🔓 "+T("l2unlocked"):T("open"))}</div></div>`
  }).join("")}</div>
  <div class="notice">${T("arDraft")}</div>
 </div>`;
 app.querySelectorAll(".langbtn").forEach(b=>b.onclick=()=>{LANG=b.dataset.l;setLangUI();viewStart()});
 app.querySelectorAll(".level.open,.level.bypassed").forEach(el=>el.onclick=()=>{
   const nm=document.getElementById("inName").value.trim();
   if(!nm){document.getElementById("inName").focus();return}
   DB.lastName=nm;save();
   const lv=+el.dataset.lv;
   if(lv===1)startSession(nm);else viewL2();
 });
}
function viewL2(){
 app.innerHTML=`<div class="card"><h2>${T("level")} 2</h2><p style="margin:10px 0">${T("l2content")}</p>
 <div class="actions"><button class="btn" id="back">${T("backHome")}</button></div></div>`;
 document.getElementById("back").onclick=viewStart;
}
function startSession(name){
 const prev=DB.results.filter(r=>r.trainee===name&&r.level===1).length;
 S={trainee:name,seed:hash(name+"|adc-poc"),attempt:prev+1,score:0,idx:0,answers:[],active:true};
 S.qlist=draw(S.attempt);
 log(`session.start · ${name} · ${LANG} · attempt ${S.attempt}`);
 viewQuestion();
}
function hud(){
 return`<div class="hud">
  <span class="pill">${T("q")} <b>${S.idx+1}</b> ${T("of")} <b>24</b></span>
  <span class="pill">${T("score")}: <b>${S.score}</b>/120</span>
  <span class="pill">${T("attempt")}: <b>${((S.attempt-1)%5)+1}</b>/5${S.attempt>5?" ⟳":""}</span>
 </div><div class="bar"><i style="width:${(S.idx)/24*100}%"></i></div>`;
}
function viewQuestion(){
 const {q,sk}=S.qlist[S.idx];
 const w=resolveWidget(q);
 const dis=realDistractors(q);
 let body="",state={sel:new Set(),seq:[],assign:{}};
 const opts=(items)=>items.map((o,i)=>`<button class="opt" data-i="${i}">${L(o)}</button>`).join("");
 if(w==="single"||w==="multi"){
   state.items=shuffled(q.correct.concat(dis),rng(S.seed+hash(q.id)));
   body=`<div class="opts">${opts(state.items)}</div>`+
     (w==="multi"?`<div class="seq">${T("selectN")(q.correct.length)}</div>`:"");
 }else if(w==="sequence"){
   state.items=shuffled(q.correct.concat(dis),rng(S.seed+hash(q.id)));
   body=`<div class="seq">${T("clickOrder")}</div><div class="opts">${opts(state.items)}</div>
   <div class="seq">${T("yourOrder")} <span id="seqOut"></span></div>`;
 }else{ // assign
   const cards=q.correct.concat(dis).map(o=>{const[c,z]=o.en.split("→").map(s=>s.trim());
     const[ca,za]=(o.ar||o.en).split("→").map(s=>s.trim());
     return{en:c,ar:ca,zoneEn:/matches nothing/i.test(z)?"__none__":z,zoneAr:za}});
   const zones=[];cards.forEach(c=>{if(c.zoneEn!=="__none__"&&!zones.some(z=>z.en===c.zoneEn))zones.push({en:c.zoneEn,ar:c.zoneAr})});
   if(cards.some(c=>c.zoneEn==="__none__"))zones.push({en:"__none__",ar:""});
   state.cards=shuffled(cards,rng(S.seed+hash(q.id)));state.zones=zones;
   body=`<div class="seq">${T("assignHint")}</div>
   <div class="opts" id="cardRow">${state.cards.map((c,i)=>`<button class="opt" data-c="${i}">${LANG==="ar"?c.ar:c.en}</button>`).join("")}</div>
   <div class="zones">${zones.map((z,i)=>`<div class="zone" data-z="${i}"><h4>${z.en==="__none__"?T("notUsed"):(LANG==="ar"?z.ar:z.en)}</h4><div class="zc"></div></div>`).join("")}</div>`;
 }
 app.innerHTML=`${hud()}
 <div class="card">
  <div class="scene"><b>${T("scene")} ${sk.id}/6 — ${L(sk.scene.name)}:</b> ${L(sk.name)}</div>
  <div class="prompt">${L(q.prompt)}</div>
  ${body}
  <div class="feedback" id="fb"></div>
  <div class="actions">
    ${(w!=="single")?`<button class="btn small" id="undo">${T("undo")}</button><button class="btn gold" id="confirm" disabled>${T("confirm")}</button>`:""}
  </div>
 </div>`;
 wireQuestion(q,w,state,dis);
}
function wireQuestion(q,w,state,dis){
 const fb=document.getElementById("fb");
 const done=(correct)=>{
   if(correct)S.score+=5;
   S.answers.push({id:q.id,ok:correct});
   log(`answer.scored · ${q.id} · ${correct?"+5":"0"} · total ${S.score}`);
   fb.className="feedback "+(correct?"ok":"no");
   fb.textContent=correct?T("ok"):T("no");
   app.querySelectorAll("button.opt,#confirm,#undo").forEach(b=>b.disabled=true);
   setTimeout(()=>{S.idx++; S.idx<24?viewQuestion():viewResult()},900);
 };
 if(w==="single"){
   app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
     b.classList.add("sel");
     done(q.correct.some(c=>c.en===state.items[+b.dataset.i].en));
   });
 }else if(w==="multi"){
   const btn=document.getElementById("confirm");
   app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
     const i=+b.dataset.i;
     state.sel.has(i)?state.sel.delete(i):state.sel.add(i);
     b.classList.toggle("sel");btn.disabled=state.sel.size===0;
   });
   document.getElementById("undo").onclick=()=>{state.sel.clear();app.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));btn.disabled=true};
   btn.onclick=()=>{
     const chosen=[...state.sel].map(i=>state.items[i].en).sort();
     const want=q.correct.map(c=>c.en).sort();
     done(chosen.length===want.length&&chosen.every((v,i)=>v===want[i]));
   };
 }else if(w==="sequence"){
   const btn=document.getElementById("confirm"),out=document.getElementById("seqOut");
   const paint=()=>{out.innerHTML=state.seq.map(i=>`<span class="chip">${L(state.items[i])}</span>`).join(" ");
     btn.disabled=state.seq.length!==q.correct.length};
   app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
     const i=+b.dataset.i;if(state.seq.includes(i))return;
     state.seq.push(i);b.classList.add("sel");paint();
   });
   document.getElementById("undo").onclick=()=>{const i=state.seq.pop();if(i!=null)app.querySelector(`.opt[data-i="${i}"]`).classList.remove("sel");paint()};
   btn.onclick=()=>{
     const chosen=state.seq.map(i=>state.items[i].en);
     const want=q.correct.map(c=>c.en);
     done(chosen.length===want.length&&chosen.every((v,i)=>v===want[i]));
   };
 }else{ // assign
   const btn=document.getElementById("confirm");let selCard=null;
   const paint=()=>{
     app.querySelectorAll(".zone .zc").forEach((zc,zi)=>{zc.innerHTML=Object.entries(state.assign)
       .filter(([ci,z])=>z===zi).map(([ci])=>`<span class="chip" data-rc="${ci}">${LANG==="ar"?state.cards[ci].ar:state.cards[ci].en}</span>`).join("")});
     app.querySelectorAll("#cardRow .opt").forEach(b=>{b.style.display=state.assign[b.dataset.c]!=null?"none":""});
     app.querySelectorAll(".chip[data-rc]").forEach(ch=>ch.onclick=()=>{delete state.assign[ch.dataset.rc];paint()});
     btn.disabled=Object.keys(state.assign).length!==state.cards.length;
   };
   app.querySelectorAll("#cardRow .opt").forEach(b=>b.onclick=()=>{
     app.querySelectorAll("#cardRow .opt").forEach(x=>x.classList.remove("sel"));
     selCard=+b.dataset.c;b.classList.add("sel");
     app.querySelectorAll(".zone").forEach(z=>z.classList.add("target"));
   });
   app.querySelectorAll(".zone").forEach(z=>z.onclick=()=>{
     if(selCard==null)return;
     state.assign[selCard]=+z.dataset.z;selCard=null;
     app.querySelectorAll(".zone").forEach(x=>x.classList.remove("target"));paint();
   });
   document.getElementById("undo").onclick=()=>{state.assign={};selCard=null;paint()};
   btn.onclick=()=>{
     const ok=state.cards.every((c,ci)=>{
       const z=state.zones[state.assign[ci]];
       return z&&z.en===(c.zoneEn==="__none__"?"__none__":c.zoneEn);
     });
     done(ok);
   };
   paint();
 }
}
function viewResult(){
 const pass=S.score>=96;
 const tryNo=((S.attempt-1)%5)+1;
 DB.results.push({trainee:S.trainee,level:1,attempt:S.attempt,score:S.score,pass,lang:LANG,
   ts:new Date().toISOString(),answers:S.answers});
 save();
 log(`level.result · ${S.trainee} · ${S.score}/120 · ${pass?"PASS":"FAIL"}`);
 S.active=false;
 app.innerHTML=`<div class="card" style="text-align:center">
  <div class="eyebrow">${T("module")}${L(CONTENT.module.name)} — ${T("level")} 1</div>
  <div class="big ${pass?"pass":"fail"}">${S.score} / 120</div>
  <h2 class="${pass?"pass":"fail"}">${pass?T("passed"):T("failed")}</h2>
  <p style="color:var(--muted);font-size:13px;margin-top:4px">${T("needed")}</p>
  ${!pass&&tryNo===5?`<p style="color:var(--gold);font-size:13px;margin-top:8px">${T("poolNote")}</p>`:""}
  <div class="actions" style="justify-content:center">
   ${!pass?`<button class="btn gold" id="again">${T("retry")}</button>`:""}
   <button class="btn" id="home">${T("backHome")}</button>
  </div>
  ${!pass?`<p style="color:var(--muted);font-size:12px;margin-top:10px">${T("retriesLeft")(Math.max(0,5-tryNo))}</p>`:""}
 </div>`;
 const a=document.getElementById("again");if(a)a.onclick=()=>startSession(S.trainee);
 document.getElementById("home").onclick=viewStart;
}
// ---------- review mode ----------
function viewReview(){
 app.innerHTML=`<div class="card review"><h2>${T("review")}</h2>
 <p style="font-size:12.5px;color:var(--muted)">${T("reviewNote")} · ${T("arDraft")}</p>
 ${CONTENT.skills.map(sk=>`
   <h3 style="margin-top:16px">Skill ${sk.id}: ${L(sk.name)} <span class="badge">${L(sk.scene.name)}</span></h3>
   <p style="font-size:12px;color:var(--muted)">${L(sk.scene.description)}</p>
   ${sk.questions.map(q=>`<div class="q"><div class="qp">${q.id}${["S1-Q1","S6-Q1","S3-Q2","S4-Q1"].includes(q.id)?" ★":""} · ${q.template} — ${L(q.prompt)}</div>
     <div class="qa c">${T("correctLbl")} ${q.correct.map(c=>L(c)).join(" · ")}</div>
     ${q.distractors.length?`<div class="qa d">${T("distLbl")} ${q.distractors.map(d=>L(d)).join(" · ")}</div>`:""}</div>`).join("")}
 `).join("")}
 <div class="actions"><button class="btn" id="back">${T("backHome")}</button></div></div>`;
 document.getElementById("back").onclick=viewStart;
}
// ---------- admin ----------
function log(m){DB.log.push(new Date().toISOString().slice(11,19)+" "+m);if(DB.log.length>400)DB.log=DB.log.slice(-400);save();paintAdmin()}
let adminAuthed=false;
function paintAdmin(){
 const body=document.getElementById("dBody");
 if(!document.getElementById("drawer").classList.contains("open"))return;
 if(!adminAuthed){
  body.innerHTML=`<label>${T("pin")}</label><input id="pin" type="password" style="max-width:160px">
   <div class="actions"><button class="btn small" id="go">OK</button></div><div id="perr" style="color:var(--red);font-size:12px;margin-top:6px"></div>`;
  document.getElementById("go").onclick=()=>{
    if(document.getElementById("pin").value===ADMIN_PIN){adminAuthed=true;paintAdmin()}
    else document.getElementById("perr").textContent=T("wrongPin");
  };
  return;
 }
 const live=S&&S.active?`${S.trainee} · ${T("q")} ${S.idx+1}/24 · ${T("score")} ${S.score}/120 · ${T("attempt")} ${((S.attempt-1)%5)+1}/5`:T("none");
 body.innerHTML=`
  <h3>${T("live")}</h3><p>${live}</p>
  <h3 style="margin-top:14px">${T("results")}</h3>
  ${DB.results.length?`<table><tr><th>${T("trainee")}</th><th>${T("attempt")}</th><th>${T("score")}</th><th>%</th><th></th></tr>
   ${DB.results.map(r=>`<tr><td>${r.trainee}</td><td>${r.attempt}</td><td>${r.score}/120</td><td>${Math.round(r.score/120*100)}%</td><td style="color:${r.pass?"var(--green)":"var(--red)"}">${r.pass?"✓":"✗"}</td></tr>`).join("")}</table>`
   :`<p style="color:var(--muted)">${T("noresults")}</p>`}
  <div class="actions"><button class="btn small" id="csv">${T("csv")}</button>
   ${DB.bypass?`<span style="font-size:12px;color:var(--gold)">🔓 ${T("unlocked")} (${DB.bypass.by})</span>`
     :`<button class="btn small gold" id="bypass">${T("unlock")}</button>`}</div>
  ${!DB.bypass?`<label>${T("adminName")}</label><input id="aname" type="text" style="max-width:200px">`:""}
  <h3 style="margin-top:14px">Log</h3><div class="loglines">${DB.log.slice(-60).reverse().map(l=>`<div>${l}</div>`).join("")}</div>`;
 const bp=document.getElementById("bypass");
 if(bp)bp.onclick=()=>{
   const nm=(document.getElementById("aname").value||"").trim();
   if(!nm){document.getElementById("aname").focus();return}
   DB.bypass={by:nm,ts:new Date().toISOString()};
   log(`gate.bypass · Level 2 unlocked by ${nm}`);save();paintAdmin();
   if(!S||!S.active)viewStart();
 };
 document.getElementById("csv").onclick=()=>{
   const rows=[["trainee","level","attempt","language","score","percent","pass","timestamp"]];
   DB.results.forEach(r=>rows.push([r.trainee,r.level,r.attempt,r.lang,r.score,Math.round(r.score/120*100)+"%",r.pass?"PASS":"FAIL",r.ts]));
   const csv=rows.map(r=>r.join(",")).join("\r\n");
   const a=document.createElement("a");
   a.href="data:text/csv;charset=utf-8,﻿"+encodeURIComponent(csv);
   a.download="adc_poc_results.csv";a.click();
 };
}
document.getElementById("btnAdmin").onclick=()=>{document.getElementById("drawer").classList.add("open");paintAdmin()};
document.getElementById("dClose").onclick=()=>document.getElementById("drawer").classList.remove("open");
document.getElementById("btnReview").onclick=viewReview;
setLangUI();viewStart();
</script>
