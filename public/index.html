// ---------- engine ----------
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function hash(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function shuffled(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const COMBOS=[];for(let a=0;a<6;a++)for(let b=a+1;b<6;b++)for(let c=b+1;c<6;c++)for(let d=c+1;d<6;d++)COMBOS.push([a,b,c,d]);
let S=null;
function draw(attempt){
 const per=[];
 for(const sk of CONTENT.skills){
   const r=rng(S.seed+sk.id*7919);
   const combo=shuffled(COMBOS,r)[(attempt-1)%COMBOS.length];
   const rq=rng(S.seed+sk.id*104729+attempt*31);
   per.push(shuffled(combo.map(i=>sk.questions[i]),rq).map(q=>({q,sk,done:false,ok:null})));
 }
 return per;
}
function widgetOf(q){
 const hasArrow=q.correct.some(c=>c.en.includes("→"));
 if(q.template==="T2"&&hasArrow)return"assign";
 if(q.template==="T4"&&q.ordered)return"sequence";
 if(q.template==="T3")return"verbal";
 return q.correct.length>1?"multi":"single";
}

// ---- floor medallion: echo of the ADC mark (three-bar glyph) in brand sage ----
function emblemCanvas(sz){
 const cv=document.createElement("canvas");cv.width=cv.height=sz;const x=cv.getContext("2d");
 const c=sz/2;
 x.beginPath();x.arc(c,c,sz*.47,0,7);x.fillStyle="rgba(255,255,255,.85)";x.fill();
 x.lineWidth=sz*.03;x.strokeStyle="#5c7470";x.beginPath();x.arc(c,c,sz*.455,0,7);x.stroke();
 x.lineWidth=sz*.01;x.strokeStyle="rgba(92,116,112,.5)";x.beginPath();x.arc(c,c,sz*.385,0,7);x.stroke();
 // the three-bar mark: top bar, diagonal, bottom bar
 x.fillStyle="#5c7470";
 const bw=sz*.30,bh=sz*.075;
 x.fillRect(c-bw*0.1,c-sz*.26,bw,bh);           // top bar (right-shifted)
 x.save();x.translate(c,c);x.rotate(-Math.PI/4);
 x.fillRect(-sz*.20,-bh/2,sz*.40,bh);x.restore(); // diagonal bar
 x.fillRect(c-bw*0.9,c+sz*.26-bh,bw,bh);         // bottom bar (left-shifted)
 return cv;
}

function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function wrap(x,text,maxw){
 const out=[];
 for(const seg of String(text).split("\n")){
   const words=seg.split(/\s+/);let cur="";
   for(const w of words){const t=cur?cur+" "+w:w;
     if(x.measureText(t).width>maxw&&cur){out.push(cur);cur=w}else cur=t}
   if(cur)out.push(cur);
 }
 return out.slice(0,7);
}
function textTexture(text,{w=512,h=256,size=34,color="#22312c",bg="rgba(255,255,255,.95)",border="#7f9d95",pad=26,bold=false,glow=true}={}){
 const cv=document.createElement("canvas");cv.width=w;cv.height=h;const x=cv.getContext("2d");
 if(glow){x.shadowColor=border;x.shadowBlur=18}
 x.fillStyle=bg;roundRect(x,6,6,w-12,h-12,20);x.fill();
 x.shadowBlur=0;
 const gr=x.createLinearGradient(0,0,0,h);gr.addColorStop(0,"rgba(255,255,255,.35)");gr.addColorStop(.4,"rgba(255,255,255,0)");
 x.fillStyle=gr;roundRect(x,6,6,w-12,h-12,20);x.fill();
 x.strokeStyle=border;x.lineWidth=3;roundRect(x,6,6,w-12,h-12,20);x.stroke();
 x.fillStyle=color;x.font=`${bold?"700":"400"} ${size}px "Segoe UI",Tahoma`;
 x.textAlign="center";x.textBaseline="middle";x.direction=LANG==="ar"?"rtl":"ltr";
 const lines=wrap(x,text,w-pad*2);
 const lh=size*1.25,y0=h/2-(lines.length-1)*lh/2;
 lines.forEach((ln,i)=>x.fillText(ln,w/2,y0+i*lh));
 const t=new THREE.CanvasTexture(cv);t.anisotropy=4;return t;
}

class LiveVoice{
 constructor(){this.ws=null;this.micCtx=null;this.micNode=null;this.micStream=null;
  this.playCtx=null;this.playCursor=0;this.sources=[];this.onTool=null;this.onText=null;this.onUserText=null;this.onClose=null;
  this.analyser=null;this.level=0;this.muted=false}
 async initMic(){
  if(this.micStream)return true;
  try{
   this.micStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
   this.micCtx=new AudioContext({sampleRate:16000});
   const src=this.micCtx.createMediaStreamSource(this.micStream);
   this.analyser=this.micCtx.createAnalyser();this.analyser.fftSize=256;src.connect(this.analyser);
   this.chunksSent=0;
   const send=(f)=>{
    if(this.muted||!this.ws||this.ws.readyState!==1)return;
    const i16=new Int16Array(f.length);
    for(let i=0;i<f.length;i++){const v=Math.max(-1,Math.min(1,f[i]));i16[i]=v<0?v*0x8000:v*0x7FFF}
    let bin="";const u8=new Uint8Array(i16.buffer);
    for(let i=0;i<u8.length;i+=8192)bin+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));
    this.ws.send(JSON.stringify({realtimeInput:{audio:{data:btoa(bin),mimeType:"audio/pcm;rate=16000"}}}));
    this.chunksSent++;
   };
   try{
    const code=`class P extends AudioWorkletProcessor{constructor(){super();this.buf=[]}process(inputs){const c=inputs[0][0];if(c){for(let i=0;i<c.length;i++)this.buf.push(c[i]);if(this.buf.length>=1600){this.port.postMessage(Float32Array.from(this.buf));this.buf.length=0}}return true}}registerProcessor("pcm",P)`;
    await this.micCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([code],{type:"application/javascript"})));
    this.micNode=new AudioWorkletNode(this.micCtx,"pcm");
    this.micNode.port.onmessage=(e)=>send(e.data);
    src.connect(this.micNode);
   }catch(err){
    log("worklet unavailable, using fallback: "+err.message);
    this.micNode=this.micCtx.createScriptProcessor(4096,1,1);
    src.connect(this.micNode);this.micNode.connect(this.micCtx.destination);
    this.micNode.onaudioprocess=(e)=>send(e.inputBuffer.getChannelData(0));
   }
   return true;
  }catch(e){log("mic error: "+e.message);return false}
 }
 micLevel(){if(!this.analyser)return 0;const d=new Uint8Array(this.analyser.frequencyBinCount);this.analyser.getByteFrequencyData(d);let s=0;for(const v of d)s+=v;return s/d.length/255}
 connect(systemPrompt,tools){
  return new Promise((resolve,reject)=>{
   const proto=location.protocol==="https:"?"wss":"ws";
   const ws=new WebSocket(`${proto}://${location.host}/live`);
   this.ws=ws;this.intentional=false;
   const sock=ws; // stale-socket guard: events from an old socket are ignored
   let settled=false;
   const to=setTimeout(()=>{if(!settled){settled=true;try{ws.close()}catch{};reject(new Error("timeout"))}},12000);
   ws.onopen=()=>{
    ws.send(JSON.stringify({setup:{
     model:CFG.liveModel,
     generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:CFG.voice||"Orus"}}}},
     systemInstruction:{parts:[{text:systemPrompt}]},
     tools:[{functionDeclarations:tools}],
     outputAudioTranscription:{},inputAudioTranscription:{},
    }}));
   };
   ws.onmessage=async(ev)=>{
    if(this.ws!==sock)return; // message from a replaced session — ignore (prevents overlapping voices)
    const m=JSON.parse(typeof ev.data==="string"?ev.data:await ev.data.text());
    if(m.setupComplete!==undefined){if(!settled){settled=true;clearTimeout(to);resolve()}return}
    if(m.serverContent){
     const sc=m.serverContent;
     if(sc.interrupted){this.stopPlayback();return}
     for(const p of (sc.modelTurn?.parts||[])){
      if(p.inlineData?.data)this.enqueueAudio(p.inlineData.data);
     }
     if(sc.outputTranscription?.text&&this.onText)this.onText(sc.outputTranscription.text,!!sc.turnComplete);
     if(sc.inputTranscription?.text&&this.onUserText)this.onUserText(sc.inputTranscription.text);
     if(sc.turnComplete&&this.onText)this.onText("",true);
    }
    if(m.toolCall&&this.onTool){
     for(const fc of m.toolCall.functionCalls||[]){
      const resp=await this.onTool(fc.name,fc.args||{});
      if(this.ws&&this.ws.readyState===1)
       this.ws.send(JSON.stringify({toolResponse:{functionResponses:[{id:fc.id,name:fc.name,response:resp||{ok:true}}]}}));
     }
    }
   };
   ws.onerror=()=>{if(this.ws!==sock)return;if(!settled){settled=true;clearTimeout(to);reject(new Error("ws error"))}};
   ws.onclose=(e)=>{if(!settled){settled=true;clearTimeout(to);reject(new Error("closed "+e.code))}
    else if(this.ws===sock&&!this.intentional&&this.onClose)this.onClose(e)};
  });
 }
 sendText(t){if(this.ws&&this.ws.readyState===1)this.ws.send(JSON.stringify({clientContent:{turns:[{role:"user",parts:[{text:t}]}],turnComplete:true}}))}
 endAudio(){if(this.ws&&this.ws.readyState===1)this.ws.send(JSON.stringify({realtimeInput:{audioStreamEnd:true}}))}
 enqueueAudio(b64){
  if(!this.playCtx)this.playCtx=new AudioContext({sampleRate:24000});
  const bin=atob(b64);const n=bin.length/2;
  const f=new Float32Array(n);
  for(let i=0;i<n;i++){let v=bin.charCodeAt(i*2)|(bin.charCodeAt(i*2+1)<<8);if(v>=0x8000)v-=0x10000;f[i]=v/0x8000}
  const buf=this.playCtx.createBuffer(1,n,24000);
  buf.getChannelData(0).set(f);
  const src=this.playCtx.createBufferSource();src.buffer=buf;src.connect(this.playCtx.destination);
  const t0=Math.max(this.playCtx.currentTime+.02,this.playCursor);
  src.start(t0);this.playCursor=t0+buf.duration;
  this.sources.push(src);src.onended=()=>{this.sources=this.sources.filter(s=>s!==src)};
 }

 destroy(){this.close();if(this.micStream){this.micStream.getTracks().forEach(t=>t.stop());this.micStream=null}
  if(this.micCtx){try{this.micCtx.close()}catch{}}if(this.playCtx){try{this.playCtx.close()}catch{}}}
}

// ---------- widgets (3D interactions) ----------
let qGroup=null,carryMesh=null;
function clearQ(){if(qGroup){scene.remove(qGroup);qGroup=null}carryMesh=null;setInteract([])}
function stageBase(i){
 clearQ();
 qGroup=new THREE.Group();
 const st=stations[i];
 qGroup.position.copy(st.pos);
 qGroup.quaternion.copy(st.group.quaternion);
 scene.add(qGroup);
 return qGroup;
}
function cardMesh(text,w,h){const m=textPanel(text,w,h,{size:40});m.userData.isCard=true;return m}
function arcPlace(meshes,y=2.15,rad=3.8,z=-2.7){
 const per=3,rows=Math.ceil(meshes.length/per);
 const yTop=y+(rows>1?.55:0);
 meshes.forEach((m,k)=>{
  const row=Math.floor(k/per),inRow=Math.min(per,meshes.length-row*per),col=k%per;
  const a=(col-(inRow-1)/2)*.68;
  m.position.set(Math.sin(a)*rad,yTop-row*1.16,z+(1-Math.cos(a))*1.3);
  m.rotation.y=-a*.42;
  m.userData.homePos=m.position.clone();
  qGroup.add(m)});
}
function stageWidget(stIdx,beat,onDone){
 const q=beat.q;const w=widgetOf(q);const dis=realDis(q);
 const g=stageBase(stIdx);
 const finish=(ok)=>{clearQ();onDone(ok)};
 if(!liveMode)speakTTS(L(q.prompt));
 if(w==="single"||w==="multi"){
   const items=shuffled(q.correct.concat(dis),rng(S.seed+hash(q.id)));
   const sel=new Set();
   const cbtn=textPanel("✓",1.4,.62,{size:46,bold:true,bg:"rgba(47,208,139,.28)",border:"#2fd08b"});
   const cards=items.map((o,ix)=>{const m=cardMesh(L(o),2.5,1.15);
     m.userData.onClick=()=>{
       if(w==="single"){finish(q.correct.some(c=>c.en===items[ix].en));return}
       sel.has(ix)?sel.delete(ix):sel.add(ix);
       m.userData.setText((sel.has(ix)?"● ":"")+L(o),{border:sel.has(ix)?"#2fd08b":"#8fa8a0"});
       cbtn.visible=sel.size>0;};
     return m});
   arcPlace(cards);
   if(stIdx===1||stIdx===4){cards.forEach(c=>c.userData.holdSelect=true);vstat(T("holdScan"),6000)}
   cbtn.position.set(0,1.05,-1.7);cbtn.visible=false;g.add(cbtn);
   cbtn.userData.onClick=()=>{const chosen=[...sel].map(i=>items[i].en).sort();
     const want=q.correct.map(c=>c.en).sort();
     finish(chosen.length===want.length&&chosen.every((v,i)=>v===want[i]))};
   setInteract(w==="multi"?cards.concat([cbtn]):cards);
 }else if(w==="sequence"){
   const items=shuffled(q.correct.concat(dis),rng(S.seed+hash(q.id)));
   const seq=[];
   const cards=items.map((o,ix)=>{const m=cardMesh(L(o),2.3,1.05);
     m.userData.onClick=()=>{if(seq.includes(ix))return;
       seq.push(ix);
       m.userData.setText(seq.length+". "+L(o),{border:"#2fd08b"});
       if(seq.length>1){
        const a=cards[seq[seq.length-2]].position,b=m.position;
        const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a.clone(),b.clone()]),
         new THREE.LineBasicMaterial({color:0xc9a24a,transparent:true,opacity:.9}));
        qGroup.add(line);
       }
       if(seq.length===q.correct.length){
         const chosen=seq.map(i=>items[i].en);const want=q.correct.map(c=>c.en);
         setTimeout(()=>finish(chosen.every((v,i)=>v===want[i])),300);
       }};
     return m});
   arcPlace(cards);
   setInteract(cards);
 }else{ // assign
   const cards=q.correct.concat(dis).map(o=>{const pe=o.en.split("→").map(s=>s.trim());
     const pa=(o.ar||o.en).split("→").map(s=>s.trim());
     return{en:pe[0],ar:pa[0]||pe[0],zoneEn:/matches nothing/i.test(pe[1]||"")?"__none__":(pe[1]||""),zoneAr:pa[1]||""}});
   const zones=[];cards.forEach(c=>{if(c.zoneEn!=="__none__"&&!zones.some(z=>z.en===c.zoneEn))zones.push({en:c.zoneEn,ar:c.zoneAr})});
   if(cards.some(c=>c.zoneEn==="__none__"))zones.push({en:"__none__",ar:""});
   const order=shuffled(cards.map((c,i)=>i),rng(S.seed+hash(q.id)));
   const assign={};let selCard=null;
   const zlabel=z=>z.en==="__none__"?(LANG==="ar"?"غير مستخدم":"Not used"):(LANG==="ar"&&z.ar?z.ar:z.en);
   const cardM=order.map(ci=>{const c=cards[ci];const m=cardMesh(LANG==="ar"?c.ar:c.en,2.3,.95);
     m.userData.ci=ci;
     m.userData.onClick=()=>{
       if(carryMesh&&carryMesh!==m&&carryMesh.userData.homePos)carryMesh.position.copy(carryMesh.userData.homePos);
       selCard=ci;carryMesh=m;
       cardM.forEach(x=>x.userData.setText(LANG==="ar"?cards[x.userData.ci].ar:cards[x.userData.ci].en,{border:x.userData.ci===ci?"#2fd08b":"#8fa8a0"}))};
     return m});
   arcPlace(cardM,2.75,4.1,-3.1);
   const zoneM=zones.map((z,zi)=>{const m=textPanel(zlabel(z),2.7,1.05,{size:34,bg:"rgba(20,45,80,.95)",border:"#35c4ff"});
     m.position.set(-((zones.length-1)/2)*3.0+zi*3.0,1.0,-1.9);
     m.userData.zi=zi;
     m.userData.onClick=()=>{if(selCard==null)return;
       assign[selCard]=zi;
       const cm=cardM.find(x=>x.userData.ci===selCard);
       if(cm){cm.visible=false;
        if(cm.userData.homePos){
         const beam=new THREE.Line(new THREE.BufferGeometry().setFromPoints([cm.userData.homePos.clone(),m.position.clone().add(new THREE.Vector3(0,.35,0))]),
          new THREE.LineBasicMaterial({color:0x5c7470,transparent:true,opacity:.75}));
         qGroup.add(beam);}}
       selCard=null;carryMesh=null;paint()};
     qGroup.add(m);return m});
   const paint=()=>{
     zoneM.forEach(zm=>{const zi=zm.userData.zi;
       const names=Object.entries(assign).filter(([c,z])=>z===zi).map(([c])=>(LANG==="ar"?cards[c].ar:cards[c].en).split(" ").slice(0,3).join(" "));
       zm.userData.setText(zlabel(zones[zi])+(names.length?"\n• "+names.join("  • "):""),{size:28});});
     if(Object.keys(assign).length===cards.length){
       const ok=cards.every((c,ci)=>{const z=zones[assign[ci]];return z&&(c.zoneEn==="__none__"?z.en==="__none__":z.en===c.zoneEn)});
       setTimeout(()=>finish(ok),400);
     }};
   setInteract(cardM.concat(zoneM));
 }
}

async function startSession(name){
 const prev=DB.results.filter(r=>r.trainee===name&&r.level===1).length;
 S={trainee:name,seed:hash(name+"|adc-poc"),attempt:prev+1,score:0,doneCount:0,answers:[],active:true,st:0};
 S.plan=draw(S.attempt);
 log(`session.start · ${name} · ${LANG} · attempt ${S.attempt}`);
 document.getElementById("startOv").style.display="none";
 document.getElementById("ctrlhint").textContent=T("hint");
 document.getElementById("voicebar").style.display="flex";
 hud();
 // voice setup
 liveMode=false;
 if(CFG.aiAvailable){
  subtitle(T("saif"),T("connecting"),true);
  const micOk=await live.initMic();
  if(!micOk)toast(T("micDenied"));
  try{
   wireLiveHandlers();
   await connectStation(0);
   liveMode=true;
   live.muted=true;
   vstat(T("voiceOn"),8000);
  }catch(e){log("live connect failed: "+e.message);toast(T("liveFail"))}

async function connectStation(i,resume){
 live.close();saifLine="";
 await live.connect(stationPrompt(i),TOOLS);
 if(resume){
  const remaining=S.plan[i].filter(b=>!b.done).map(b=>b.q.id).join(", ");
  live.sendText(`[SYSTEM] The connection was briefly interrupted mid-station; you were already talking with ${S.trainee}. Remaining moments: ${remaining||"none — call station_complete"}. Continue naturally in one short sentence without re-greeting.`);
 }else if(i===0){
  live.sendText(`[SYSTEM] Trainee ${S.trainee} has just entered the Abu Dhabi Customs Training Academy through the main gate, on their first-morning orientation. Give a warm welcome (about 3 sentences): greet them by name, explain that this morning the two of you will walk through six stations that reflect ADC's values and daily work — and that they can simply talk with you at any moment. Then lead into this first station's scenario.`);
 }else{
  live.sendText(`[SYSTEM] Trainee ${S.trainee} just walked up to your station. Greet them briefly and begin the scenario.`);
 }
}
function runStation(i,classic){
 S.st=i;
 stations.forEach((s,k)=>{s.group.userData.beam.visible=k===i});
 const a=stationAngle(i);
 saifTarget=new THREE.Vector3(Math.sin(a)*(R-5.2)+Math.cos(a)*1.9,0,-Math.cos(a)*(R-5.2)+Math.sin(a)*1.9);
 glideTo(i);
 hud();
 if(classic){
  speakTTS(i===0?T("welcome"):T("stationIntro")[i]);
  setTimeout(()=>classicBeat(i,0),FAST?400:(i===0?7000:2600));
 }
}
async function advanceStation(){
 clearQ();
 if(S.st+1<6){
  const next=S.st+1;
  if(liveMode){
   try{await connectStation(next)}catch(e){log("reconnect failed: "+e.message);liveMode=false}
  }
  runStation(next,!liveMode);
 }else endLevel();
}
// classic (no-voice) fallback: narrated sequential beats
function classicBeat(i,b){
 if(b>=4){if(i+1<6){S.st=i+1;runStation(i+1,true)}else endLevel();return}
 const beat=S.plan[i][b];
 if(beat.done){classicBeat(i,b+1);return}
 const q=beat.q;
 if(widgetOf(q)==="verbal"){
  // typed answer via REST proxy, options as fallback
  subtitle(T("saif"),L(q.prompt),true);
  speakTTS(L(q.prompt));
  classicVerbal(q,(ok)=>{applyScore(beat,ok);setTimeout(()=>classicBeat(i,b+1),900)});
 }else{
  stageWidget(i,beat,(ok)=>{applyScore(beat,ok);setTimeout(()=>classicBeat(i,b+1),900)});
 }
}
function classicVerbal(q,done){
 vstat(T("classicPrompt"),0);
 const input=document.getElementById("chattext");input.value="";input.focus();
 const optBtn=document.createElement("button");optBtn.className="btn small navy";optBtn.textContent=T("showOpts");
 document.getElementById("chatin").appendChild(optBtn);
 const cleanup=()=>{optBtn.remove();sendBtn.onclick=defaultSend;input.onkeydown=null;pendingVerbalSubmit=null};
 const fallbackOpts=()=>{cleanup();
  const dis=realDis(q);const items=shuffled(q.correct.concat(dis),rng(S.seed+hash(q.id)));
  const cards=items.map((o,ix)=>{const m=cardMesh(L(o),2.7,1.2);
    m.userData.onClick=()=>{clearQ();done(q.correct.some(c=>c.en===items[ix].en))};return m});
  stageBase(S.st);arcPlace(cards);setInteract(cards)};
 optBtn.onclick=fallbackOpts;
 const sendBtn=document.getElementById("chatsend");
 const submitText=async(raw)=>{
  const t=(raw||"").trim();if(!t)return;input.value="";
  subtitle(T("you"),t);vstat(T("judging"),0);
  try{
   const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    contents:[{parts:[{text:`Judge a customs-training answer. Question: ${L(q.prompt)} Correct idea: ${q.correct.map(c=>L(c)).join(" / ")}. Wrong ideas: ${realDis(q).map(d=>L(d)).join(" / ")}. Trainee said: "${t}". Accept paraphrase / mostly-correct. Reply ONLY JSON {"correct":bool,"feedback":"one short sentence in ${LANG==="ar"?"Arabic":"English"}"}`}]}],
    generationConfig:{responseMimeType:"application/json",temperature:.2}})});
   const d=await r.json();
   const v=JSON.parse(d.candidates[0].content.parts[0].text);
   speakTTS(v.feedback,T("saif"));cleanup();vstat("");done(!!v.correct);
  }catch(e){log("judge error: "+e.message);fallbackOpts()}
 };
 const submit=()=>submitText(input.value);
 pendingVerbalSubmit=submitText; // orb push-to-talk routes here while this beat is open
 const defaultSend=sendBtn.onclick;
 sendBtn.onclick=submit;
 input.onkeydown=e=>{if(e.key==="Enter")submit()};
}

// ---------- hold-to-talk (works in voice mode and guided mode) ----------
let pendingVerbalSubmit=null;
let pttRecog=null,talking=false,spaceHeld=false;
const orbEl=document.getElementById("orb");
async function startTalk(){
 if(!S||!S.active||talking)return;
 talking=true;
 orbEl.classList.add("hot");orbEl.classList.remove("off","ai");orbEl.textContent="\u{1F534}";
 vstat(T("listening"),0);
 if(liveMode){
  if(!live.micStream){ // mic was denied/absent at start — ask again now (user gesture)
   const ok=await live.initMic();
   if(!ok){talking=false;orbRestore();vstat(T("noSR"));return}
  }
  if(S)S._chunks0=live.chunksSent||0;
  live.stopPlayback(); // barge-in: silence Saif while you talk
  live.muted=false;
  if(live.micCtx&&live.micCtx.state==="suspended")live.micCtx.resume();
  if(live.playCtx&&live.playCtx.state==="suspended")live.playCtx.resume();
 }else{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){talking=false;orbRestore();vstat(T("noSR"));return}
  // browser speech recognition conflicts with an open getUserMedia stream — release ours first
  if(live.micStream){try{live.micStream.getTracks().forEach(t=>t.stop())}catch{};live.micStream=null;
   if(live.micCtx){try{live.micCtx.close()}catch{};live.micCtx=null;live.micNode=null;live.analyser=null}}
  try{
   pttRecog=new SR();pttRecog.lang=LANG==="ar"?"ar-SA":"en-US";pttRecog.interimResults=false;
   pttRecog.onresult=ev=>{const t=ev.results[0][0].transcript;
    if(pendingVerbalSubmit)pendingVerbalSubmit(t);else generalAsk(t)};
   pttRecog.onerror=(ev)=>{vstat(T("noSR")+(ev.error?" · "+ev.error:""));log("SR error: "+ev.error)};
   pttRecog.start();
  }catch(e){vstat(T("noSR"))}
 }
}
function orbRestore(){
 orbEl.classList.remove("hot");
 orbEl.textContent="\u{1F399}\uFE0F";
 orbEl.classList.add("off");
 vstat(T("holdTalk"),2500);
}
function endTalk(){
 if(!talking)return;talking=false;
 if(liveMode){
  live.muted=true;live.endAudio();
  if((live.chunksSent||0)===(S&&S._chunks0||0)){vstat(T("micNoAudio"),5000);log("PTT released but 0 audio chunks were sent")}
 }
 else if(pttRecog){try{pttRecog.stop()}catch{};pttRecog=null}
 orbRestore();
}

 const bp=document.getElementById("bp");
 if(bp)bp.onclick=()=>{const nm=(document.getElementById("an").value||"").trim();
  if(!nm){document.getElementById("an").focus();return}
  DB.bypass={by:nm,ts:new Date().toISOString()};log(`gate.bypass · by ${nm}`);save();paintAdmin();
  if(!S||!S.active)showStart()};
 document.getElementById("csv").onclick=()=>{
  const rows=[["trainee","level","attempt","language","score","percent","pass","timestamp"]];
  DB.results.forEach(r=>rows.push([r.trainee,r.level,r.attempt,r.lang,r.score,Math.round(r.score/120*100)+"%",r.pass?"PASS":"FAIL",r.ts]));
  const a=document.createElement("a");
  a.href="data:text/csv;charset=utf-8,﻿"+encodeURIComponent(rows.map(r=>r.join(",")).join("\r\n"));
  a.download="adc_results.csv";a.click()};
}

// ---------- render loop ----------
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
addEventListener("resize",resize);resize();
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 const t=clock.elapsedTime;
 moveTick(dt);hoverTick();
 camera.position.copy(camPos);
 camera.rotation.set(0,0,0);camera.rotateY(yaw);camera.rotateX(pitch);
 saifSpeaking=liveMode?live.speaking:saifSpeaking;
 saif.position.lerp(new THREE.Vector3(saifTarget.x,0,saifTarget.z),Math.min(1,dt*2));
 saif.children[2].position.y=2.08+Math.sin(t*2)*.04;
 saif.children[3].rotation.z=t*.8;
 saif.userData.glow.intensity=3.5+(saifSpeaking?Math.sin(t*16)*2.2+2:0)+Math.sin(t*3)*.4;
 saif.userData.tag.lookAt(camPos.x,2.6,camPos.z);
 saif.lookAt(camPos.x,1.2,camPos.z);
 stations.forEach((s,i)=>{
  s.group.userData.beam.rotation.y=t*.6;
  s.group.children.forEach(ch=>{if(ch.userData.spin)ch.rotation.y=Math.sin(t*ch.userData.spin*8)*.22});
  if(s.group.userData.container){const ph=(t*.18)%1;s.group.userData.container.position.x=-4.1+ph*8.2}
  if(s.group.userData.visitor)s.group.userData.visitor.children[1].position.y=1.95+Math.sin(t*1.6)*.03;
 });
 if(carryMesh&&qGroup){
  const p=new THREE.Vector3(0,-.35,-2.1).applyQuaternion(camera.quaternion).add(camera.position);
  qGroup.worldToLocal(p);
  carryMesh.position.lerp(p,.3);
 }
 if(qGroup)qGroup.children.forEach((m,i)=>{if(m.userData.isCard&&m!==carryMesh)m.position.y+=Math.sin(t*1.4+i)*.0008});
 dust.rotation.y=t*.006;
 // voice orb
 const orb=document.getElementById("orb");
 if(S&&S.active&&liveMode){
  if(!talking)orb.classList.toggle("ai",live.speaking);
  const lv=talking?live.micLevel():0;
  orb.style.transform=`scale(${1+Math.min(.5,lv*2.2)})`;
 }
 renderer.render(scene,camera);
}
animate();
window.__adc={get S(){return S},get qGroup(){return qGroup},get cam(){return camPos},get liveMode(){return liveMode},stations};

// ---------- boot ----------
fetch("/api/config").then(r=>r.json()).then(c=>{CFG=c}).catch(()=>{CFG={aiAvailable:false}}).finally(()=>{showStart()});
</script>
</body>
</html>
