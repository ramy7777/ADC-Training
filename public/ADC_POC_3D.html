<style>
:root{--teal:#00736a;--teal-dk:#005a53;--ink:#1f2a2e;--muted:#61707a;--line:#dde5e8;--soft:#f4f7f8;--sand:#c8a45a;--green:#1fa877;--red:#d84a38}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Segoe UI",Tahoma,sans-serif;background:#e8eef1;color:var(--ink)}
#c3d{position:fixed;inset:0;display:block}
/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;
 background:linear-gradient(rgba(8,26,30,.45),rgba(8,26,30,.72)),url("img/port-panorama.jpg") center/cover}
.panel{background:#fff;border-radius:14px;padding:0;max-width:600px;width:94vw;box-shadow:0 30px 80px rgba(0,20,25,.45);overflow:hidden}
.brandbar{display:flex;align-items:center;gap:12px;padding:16px 26px;border-bottom:1px solid var(--line)}
.brandmark{width:38px;height:38px;border-radius:8px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;letter-spacing:.02em}
.brandtxt{line-height:1.25}
.brandtxt .a{font-weight:700;font-size:14.5px}
.brandtxt .b{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.pbody{padding:22px 26px 26px}
.eyebrow{color:var(--teal);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
h2{font-size:23px;margin-bottom:10px;color:var(--ink)}
h3{font-size:13.5px;margin-bottom:6px;color:var(--teal)}
label{font-size:12.5px;color:var(--muted);display:block;margin:14px 0 5px;font-weight:600}
input[type=text],input[type=password]{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--teal)}
button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;font-size:14px}
.btn{background:var(--teal);color:#fff;padding:11px 22px;font-weight:700}
.btn:hover{background:var(--teal-dk)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);font-weight:500}
.btn.small{padding:7px 13px;font-size:12.5px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.langrow{display:flex;gap:0;margin-top:4px;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;width:max-content}
.langbtn{padding:9px 26px;background:#fff;color:var(--ink);border-radius:0;border-inline-end:1.5px solid var(--line)}
.langbtn:last-child{border-inline-end:none}
.langbtn.sel{background:var(--teal);color:#fff;font-weight:700}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.level{border:1.5px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;background:#fff}
.level .num{font-size:19px;font-weight:700}
.level .st{font-size:10.5px;color:var(--muted);margin-top:3px}
.level.open{border-color:var(--teal);cursor:pointer}
.level.open .num{color:var(--teal)}
.level.open:hover{background:#eef6f5}
.level.locked{opacity:.45}
.level.bypassed{border-color:var(--sand);cursor:pointer}
.hint{font-size:11.5px;color:var(--muted);margin-top:16px;line-height:1.7}
.foot{font-size:10.5px;color:#9aa7ad;padding:10px 26px;border-top:1px solid var(--line);display:flex;justify-content:space-between}
/* ---------- HUD ---------- */
#hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:6px;z-index:20;font-size:12.5px}
#hudrow{display:flex;gap:8px}
#hud .pill{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:99px;padding:7px 16px;color:var(--ink);box-shadow:0 4px 14px rgba(0,25,30,.12)}
#hud b{color:var(--teal)}
#prog{width:300px;height:5px;background:rgba(255,255,255,.75);border-radius:99px;overflow:hidden;box-shadow:0 2px 8px rgba(0,25,30,.15)}
#progfill{height:100%;width:0%;background:var(--teal);border-radius:99px;transition:width .4s}
#brandchip{position:fixed;top:14px;inset-inline-start:14px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:12px;padding:8px 14px;z-index:20;box-shadow:0 4px 14px rgba(0,25,30,.12)}
#brandchip .brandmark{width:30px;height:30px;font-size:13px}
#brandchip .t1{font-size:12.5px;font-weight:700;line-height:1.2}
#brandchip .t2{font-size:9.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
#topbtns{position:fixed;top:14px;inset-inline-end:14px;display:flex;gap:8px;z-index:31}
#topbtns .btn{background:rgba(255,255,255,.94);color:var(--ink);border:1px solid var(--line);font-weight:600;font-size:12.5px;padding:9px 14px;box-shadow:0 4px 14px rgba(0,25,30,.12)}
#topbtns .btn:hover{background:#fff;border-color:var(--teal);color:var(--teal)}
/* ---------- subtitles ---------- */
#sub{position:fixed;bottom:112px;left:50%;transform:translateX(-50%);max-width:780px;width:94vw;z-index:20;display:none}
#sub .card{display:flex;gap:14px;align-items:flex-start;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:14px;padding:12px 18px;box-shadow:0 14px 40px rgba(0,25,30,.25)}
#sub img{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid var(--teal);flex:none}
#sub .fallbackav{width:52px;height:52px;border-radius:50%;background:var(--sand);color:#fff;display:none;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none}
#sub .who{color:var(--teal);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
#sub .txt{font-size:16px;line-height:1.5;color:var(--ink);margin-top:2px}
/* ---------- conversation ---------- */
#convstat{position:fixed;bottom:132px;left:50%;transform:translateX(-50%);font-size:12px;color:#fff;background:rgba(31,42,46,.85);padding:5px 14px;border-radius:99px;z-index:21;display:none}
/* sits ABOVE the always-on chat bar so the "Show choices" escape is never hidden */
#conv{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);display:none;gap:9px;z-index:23;align-items:center;flex-wrap:wrap;justify-content:center;max-width:94vw;background:rgba(255,255,255,.97);border:1px solid var(--line);padding:8px 11px;border-radius:99px;box-shadow:0 14px 40px rgba(0,25,30,.25)}
#conv input{width:300px;padding:10px 12px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:13.5px;font-family:inherit}
#talk{background:var(--teal);color:#fff;font-weight:700;width:46px;height:46px;border-radius:50%;font-size:19px;flex:none}
#talk.rec{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(216,74,56,.5)}70%{box-shadow:0 0 0 14px rgba(216,74,56,0)}100%{box-shadow:0 0 0 0 rgba(216,74,56,0)}}
#spacehint{position:fixed;bottom:76px;inset-inline-end:16px;font-size:11px;color:var(--muted);background:rgba(255,255,255,.9);padding:6px 12px;border-radius:9px;z-index:21;display:none;border:1px solid var(--line)}
#askrow{display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:22;gap:8px;background:rgba(255,255,255,.97);border:1px solid var(--line);padding:9px 12px;border-radius:99px;box-shadow:0 14px 40px rgba(0,25,30,.25);align-items:center}
#askrow input{width:340px;padding:10px 12px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-family:inherit}
#askmic{width:44px;height:44px;border-radius:50%;border:none;background:var(--teal);color:#fff;font-size:19px;cursor:pointer;flex:none}
#askmic.rec{background:var(--red);animation:pulse 1s infinite}
#convin,#convsend,#talk{display:none!important} /* typed/PTT answers now go through the always-on chat bar */
#ctrlhint{position:fixed;bottom:16px;inset-inline-start:16px;font-size:11px;color:var(--muted);z-index:19;background:rgba(255,255,255,.9);border:1px solid var(--line);padding:8px 12px;border-radius:9px;line-height:1.7;max-width:330px}
/* ---------- Enter VR (shown only on WebXR-capable browsers) ---------- */
#btnVR{position:fixed;bottom:18px;inset-inline-end:18px;z-index:32;display:none;align-items:center;gap:10px;
 padding:13px 24px;border-radius:99px;font-weight:800;font-size:13.5px;letter-spacing:.08em;color:#08211f;
 background:linear-gradient(135deg,#eed9a3,#c8a45a 60%,#b18f45);border:1.5px solid rgba(255,255,255,.6);
 box-shadow:0 10px 30px rgba(0,25,30,.4),0 0 22px rgba(215,181,109,.45);transition:transform .15s,box-shadow .15s}
#btnVR:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(0,25,30,.5),0 0 32px rgba(215,181,109,.75)}
#btnVR svg{width:22px;height:22px;flex:none}
#flash{position:fixed;inset:0;pointer-events:none;z-index:17;opacity:0;transition:opacity .5s}
#errbar{position:fixed;top:0;left:0;right:0;background:#8c2318;color:#fff;font-size:12px;padding:6px 12px;z-index:99;display:none;white-space:pre-wrap}
/* ---------- drawer ---------- */
.drawer{position:fixed;top:0;right:0;width:min(430px,95vw);height:100vh;background:#fff;border-left:1px solid var(--line);transform:translateX(105%);transition:transform .25s;z-index:50;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,25,30,.15)}
.drawer.open{transform:translateX(0)!important}
.drawer .dhead{background:var(--teal);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px}
.drawer .dhead .btn{background:rgba(255,255,255,.18);color:#fff}
.drawer .dbody{padding:16px 18px;overflow-y:auto;flex:1;font-size:13px}
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:8px}
th{background:var(--soft);padding:6px 8px;text-align:start;font-weight:700;color:var(--ink);border:1px solid var(--line)}
td{border:1px solid var(--line);padding:5px 8px}
.loglines{font-size:11.5px;color:var(--muted);max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:6px;background:var(--soft)}
.big{font-size:46px;font-weight:800;text-align:center}
.pass{color:var(--green)}.fail{color:var(--red)}
.center{text-align:center}
</style>
</head>

/* ================= assessment engine (identical rules to 2D/VR) ================= */
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function hash(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function shuffled(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const COMBOS=[];for(let a=0;a<6;a++)for(let b=a+1;b<6;b++)for(let c=b+1;c<6;c++)for(let d=c+1;d<6;d++)COMBOS.push([a,b,c,d]);
let S=null;
function draw(attempt){
 const per=[];
 for(const sk of CONTENT.skills){
   const r=rng(S.seed+sk.id*7919);
   const combo=shuffled(COMBOS,r)[(attempt-1)%COMBOS.length];
   const rq=rng(S.seed+sk.id*104729+attempt*31);
   per.push(shuffled(combo.map(i=>sk.questions[i]),rq).map(q=>({q,sk})));
 }
 return per; // 6 stations × 4 beats
}
function widgetOf(q){
 const hasArrow=q.correct.some(c=>c.en.includes("→"));
 if(q.template==="T2"&&hasArrow)return"assign";
 if(q.template==="T4"&&q.ordered)return"sequence";
 if(q.template==="T3")return"conv";
 if(q.template==="T4")return q.correct.length>1?"hotmulti":"hotsingle";
 return q.correct.length>1?"multi":"single";
}
const realDis=q=>q.distractors.filter(d=>!d.en.trim().startsWith("("));

function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function wrap(x,text,maxw){
 const out=[];
 for(const seg of String(text).split("\n")){
   const words=seg.split(/\s+/);let cur="";
   for(const w of words){const t=cur?cur+" "+w:w;
     if(x.measureText(t).width>maxw&&cur){out.push(cur);cur=w}else cur=t}
   if(cur)out.push(cur);
 }
 return out.slice(0,7);
}
function textTexture(text,{w=512,h=256,size=34,color="#1f2a2e",bg="rgba(255,255,255,0.97)",border="#00736a",pad=24,bold=false,badge=null}={}){
 const cv=document.createElement("canvas");cv.width=w;cv.height=h;const x=cv.getContext("2d");
 if(badge!=null){const grd=x.createLinearGradient(0,0,0,h);grd.addColorStop(0,"#ffffff");grd.addColorStop(1,"#e6f2ef");x.fillStyle=grd}
 else x.fillStyle=bg;
 roundRect(x,3,3,w-6,h-6,20);x.fill();
 x.strokeStyle=border;x.lineWidth=4;roundRect(x,3,3,w-6,h-6,20);x.stroke();
 x.textAlign="center";x.textBaseline="middle";x.direction=LANG==="ar"?"rtl":"ltr";
 let cx=w/2,tpad=pad;
 if(badge!=null){
   const bx=LANG==="ar"?w-46:46;
   x.fillStyle="#00736a";x.beginPath();x.arc(bx,h/2,25,0,7);x.fill();
   x.fillStyle="#ffffff";x.font='700 30px "Segoe UI",Tahoma';x.fillText(String(badge),bx,h/2+1);
   cx=w/2+(LANG==="ar"?-30:30);tpad=pad+55;
 }
 x.fillStyle=color;x.font=`${bold?"700":"500"} ${size}px "Segoe UI",Tahoma`;
 const lines=wrap(x,text,w-tpad*2);
 const lh=size*1.25,y0=h/2-(lines.length-1)*lh/2;
 lines.forEach((ln,i)=>x.fillText(ln,cx,y0+i*lh));
 const t=new THREE.CanvasTexture(cv);t.anisotropy=4;t.colorSpace=THREE.SRGBColorSpace;return t;
}

}

     grabPos:o.position.clone(),grabRot:o.rotation.x,moved:0};

   const wp=new THREE.Vector3();o.getWorldPosition(wp);

   drag.plane.setFromNormalAndCoplanarPoint(n,wp);
   o.scale.setScalar((o.userData.baseScale||1)*1.12);

});
canvas.addEventListener("pointermove",e=>{
 pointerNDC(e);
 if(drag){
   drag.moved+=Math.abs(e.movementX)+Math.abs(e.movementY);
   ray.setFromCamera(mouse,camera);
   const p=new THREE.Vector3();
   if(ray.ray.intersectPlane(drag.plane,p)){
     const lp=drag.obj.parent?drag.obj.parent.worldToLocal(p.clone()):p;
     drag.obj.position.lerp(lp,.55);

   const zh=ray.intersectObjects(dropTargets,false);
   dropTargets.forEach(z=>{if(z.userData.setHot)z.userData.setHot(zh.length&&zh[0].object===z)});

addEventListener("pointerup",e=>{

   if(drag.moved<6&&o.userData.onClick){

     const cb=o.userData.onClick;drag=null;tick();cb(o);return;
   }

   const zh=ray.intersectObjects(dropTargets,false);
   dropTargets.forEach(z=>{if(z.userData.setHot)z.userData.setHot(false)});
   let accepted=false;
   if(zh.length&&zh[0].object.userData.onDrop)accepted=zh[0].object.userData.onDrop(o)!==false;
   if(!accepted){flyBack(o,drag.home);

     if(o.userData.onReturn)o.userData.onReturn(o)}

function vrHoverTick(){

let snapCool=0,stepAcc=0;
const _hq=new THREE.Quaternion(),_hf=new THREE.Vector3(),_hr=new THREE.Vector3();
function vrMoveTick(dt){
 snapCool=Math.max(0,snapCool-dt);
 const sess=renderer.xr.getSession();if(!sess)return;
 for(const src of sess.inputSources){
  const gp=src.gamepad;if(!gp||!gp.axes)continue;
  const ctl=controllers.find(c=>c.userData.src===src);
  // xr-standard puts the thumbstick at axes[2/3]; older profiles at [0/1]
  const sx=gp.axes.length>=4?gp.axes[2]:(gp.axes[0]||0);
  const sy=gp.axes.length>=4?gp.axes[3]:(gp.axes[1]||0);
  if(src.handedness!=="right"){ // left stick (or unknown hand): walk where you look
   if(Math.abs(sx)>.15||Math.abs(sy)>.15){
    camera.getWorldQuaternion(_hq);
    _hf.set(0,0,-1).applyQuaternion(_hq);_hf.y=0;_hf.normalize();
    _hr.set(-_hf.z,0,_hf.x);
    camPos.addScaledVector(_hf,-sy*4*dt);
    camPos.addScaledVector(_hr,sx*4*dt);
    stepAcc+=Math.hypot(sx,sy)*4*dt; // footstep-style pulses while walking
    if(stepAcc>.62){stepAcc=0;buzz(ctl,.25,28)}
   }
  }
  if(src.handedness==="right"&&Math.abs(sx)>.6&&snapCool<=0){ // comfort snap turn
   yaw-=Math.sign(sx)*Math.PI/6;snapCool=.32;buzz(ctl,.5,70);
  }
 }
 const l=Math.hypot(camPos.x,camPos.z);if(l>66){camPos.x*=66/l;camPos.z*=66/l}

// fires the "this line finished speaking" callback of the current queue item
function hostFin(){const c=HOST.cur;HOST.cur=null;if(c&&c.cb)try{c.cb()}catch(e){}}
async function hostPump(){
 if(HOST.pumping||HOST.talking||!HOST.q.length)return;
 if(HOST.onScore&&HOST.q[0].kind!=="ASK")return; // narration waits until the verbal question is judged
 if(HOST.hold&&Date.now()-HOST.hold<15000)return; // the trainee is talking to Saif — don't talk over them
 HOST.pumping=true;
 const ok=await hostEnsure();
 HOST.pumping=false;
 if(!ok){if(HOST.failed>=2)HOST.q.length=0;else setTimeout(hostPump,1500);return}
 if(HOST.talking||!HOST.q.length)return; // state may have changed during the await
 if(HOST.onScore&&HOST.q[0].kind!=="ASK")return;
 if(HOST.hold&&Date.now()-HOST.hold<15000)return;
 const it=HOST.q.shift();
 HOST.talking=true;HOST.cur=it;
 HOST.gotAct=false;HOST.lastAct=Date.now();
 hostArm();
 if(it.kind==="ASK")live.muted=false; // open the mic exactly when a question starts
 live.sendText(`[${it.kind}] ${it.text}`);
}
// End-of-speech detector: turnComplete is unreliable around tool calls, so we
// also poll for the real thing — generation went quiet AND every scheduled
// audio chunk finished playing. Never fires into a still-running generation.
function hostArm(){
 clearInterval(HOST.watch);
 HOST.watch=setInterval(()=>{
  if(!HOST.talking){clearInterval(HOST.watch);return}
  if(live.speaking)return; // audio still audible — not done
  const idle=Date.now()-HOST.lastAct;
  if(HOST.gotAct?idle>1800:idle>8000){ // quiet + drained → the turn is over
   clearInterval(HOST.watch);HOST.talking=false;hostFin();hostPump();
  }
 },700);
}
// a new beat or station makes older, still-unspoken narration obsolete
function hostFlush(){HOST.q=HOST.q.filter(it=>it.kind==="ASK")}
async function hostEnsure(){

 if(HOST.connecting)return HOST.connecting; // single-flight: parallel callers share one connect
 HOST.connecting=_hostConnect();
 try{return await HOST.connecting}finally{HOST.connecting=null}
}
async function _hostConnect(){
 HOST.on=false;
 if(HOST.failed>=2||!AI_ON||!window.isSecureContext)return false;
 if(!(await live.initMic())){HOST.failed=9;log("host: mic denied");return false}
 try{
  await live.unlock();
  const name=S?S.trainee:"";
  const know=CONTENT.skills.map((sk,i)=>`${i+1}. "${sk.scene.name.en}" — assesses: ${sk.name.en} (${sk.levelAnchor.en}). Setting: ${sk.scene.description.en}`).join("\n");
  const sys=`You are Saif, a wise senior Abu Dhabi Customs officer and a wonderful storyteller, hosting a new employee named "${name}" through a 3D assessment, "A Morning at Abu Dhabi Customs".
Speak ONLY ${LANG==="ar"?"Arabic":"English"}. Warm, encouraging, a touch of humor; an educator who makes customs work fascinating.
About Abu Dhabi Customs (ADC): it protects the emirate's borders and society, secures trade flows through its ports and land crossings like Al Ghuweifat, collects duties, fights smuggling, and enables businesses through smart digital services. The trainee walks through six gallery stations, each with four assessment moments worth 5 marks (pass: 96 of 120):
${know}
You receive bracketed system commands. The trainee never sees them; never mention or read them aloud:
- [SAY] <text>: deliver this message naturally in your own words, keeping the meaning. When introducing a station, add ONE vivid sentence about why that part of customs work matters. Do not ask questions, do not wait for a reply. Keep it under 35 words.
- [ASK] <context>: run a verbal assessment moment. Ask the given question in ONE short sentence, then listen. Accept paraphrases and substantially-correct answers. If the trainee is silent or off-topic, gently re-ask once. As soon as they answer, call score_answer with correct=true/false and one short feedback sentence, and speak that feedback.
- [NOTE] <event>: a progress update. React with one very short encouraging phrase (2–6 words), nothing more.
- A plain message is the trainee talking to you. If they ask what to do now, explain the current step precisely using the latest [SAY]/[ASK] context. If they ask about ADC, its sections or services, teach them like a wise mentor — educative and entertaining, under 40 words.`;
  live.onText=(t,done)=>{
   if(t){HOST.buf+=t;subtitle(HOST.who||T("saif"),HOST.buf,true)}
   if(done){HOST.buf="";HOST.talking=false;clearInterval(HOST.watch);HOST.hold=0;hostFin();hostPump()}
  };
  live.onUserText=(t)=>{HOST.lastUser=Date.now();const st=document.getElementById("convstat");
   if(!live.muted&&st.style.display!=="none")st.textContent="🎙 "+t};
  live.onActivity=()=>{HOST.lastAct=Date.now();HOST.gotAct=true};
  live.onTool=async(n,a)=>{if(n==="score_answer"&&HOST.onScore){const f=HOST.onScore;HOST.onScore=null;f(a||{});hostPump()}return{ok:true}};
  live.onClose=()=>{HOST.on=false;HOST.talking=false;clearInterval(HOST.watch);
   setTimeout(hostPump,800)}; // auto-reconnect on next queued line
  await live.connect(sys,[{name:"score_answer",description:"Record the assessment of the trainee's verbal answer during an [ASK] moment. Call exactly once per question.",
    parameters:{type:"OBJECT",properties:{correct:{type:"BOOLEAN"},feedback:{type:"STRING",description:"one short in-character sentence"}},required:["correct"]}}]);
  live.muted=true; // mic opens only during [ASK] moments
  HOST.on=true;HOST.failed=0;

 }catch(e){HOST.failed++;log("host error: "+e.message);return false}
}

/* ---------- gemini ---------- */
async function gemini(prompt,json=true){
 const body={contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.3}};
 if(json)body.generationConfig.responseMimeType="application/json";
 let r;
 if(AI_ON){
   r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
 }else{
   const key=getKey();
   if(!key)throw new Error("nokey");
   r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GMODEL}:generateContent?key=${key}`,
    {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
 }
 if(!r.ok)throw new Error("gemini "+r.status);
 const d=await r.json();
 return d.candidates[0].content.parts[0].text;
}
async function judgeAnswer(q,answer){
 const exp=q.correct.map(c=>L(c)).join(" / ");
 const wrong=realDis(q).map(d=>L(d)).join(" / ");
 const p=`You are Saif, a senior Abu Dhabi Customs training officer, scoring one spoken answer from a junior trainee inside a training simulation. Language of session: ${LANG==="ar"?"Arabic":"English"}.
Situation/question posed to trainee: ${L(q.prompt)}
The intended correct idea: ${exp}
Known wrong ideas (do not accept these): ${wrong}
Trainee's answer: "${answer}"
Be encouraging but honest. Accept paraphrases and partial-but-substantially-correct answers (e.g. 2 of 3 items named). Reject answers matching the wrong ideas or missing the core point.
Reply ONLY JSON: {"correct": true|false, "feedback": "<one short sentence in ${LANG==="ar"?"Arabic":"English"}, spoken as Saif>"}`;
 return JSON.parse(await gemini(p,true));
}

}

/* ---------- Gemini Live native voice (via server /live relay) ---------- */
class LiveVoice{
 constructor(){this.ws=null;this.micCtx=null;this.micNode=null;this.micStream=null;
  this.playCtx=null;this.playCursor=0;this.sources=[];this.onTool=null;this.onText=null;this.onUserText=null;this.onClose=null;
  this.muted=false;this.hot=false}
 async initMic(){
  if(this.micStream)return true;
  if(this._micP)return this._micP; // single-flight: concurrent callers share one request
  this._micP=this._initMic();
  try{return await this._micP}finally{this._micP=null}
 }
 async _initMic(){
  try{
   this.micStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
   this.micCtx=new AudioContext({sampleRate:16000});
   if(this.micCtx.state==="suspended")try{await this.micCtx.resume()}catch(e){}
   const src=this.micCtx.createMediaStreamSource(this.micStream);
   const send=(f)=>{
    // anti-echo: don't stream the mic while Saif's voice is playing — UNLESS the
    // trainee is deliberately holding push-to-talk (hot), which must always get through
    if(this.muted||(this.sources.length>0&&!this.hot)||!this.ws||this.ws.readyState!==1)return;
    const i16=new Int16Array(f.length);
    for(let i=0;i<f.length;i++){const v=Math.max(-1,Math.min(1,f[i]));i16[i]=v<0?v*0x8000:v*0x7FFF}
    let bin="";const u8=new Uint8Array(i16.buffer);
    for(let i=0;i<u8.length;i+=8192)bin+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));
    this.ws.send(JSON.stringify({realtimeInput:{audio:{data:btoa(bin),mimeType:"audio/pcm;rate=16000"}}}));
   };
   try{
    const code=`class P extends AudioWorkletProcessor{constructor(){super();this.buf=[]}process(inputs){const c=inputs[0][0];if(c){for(let i=0;i<c.length;i++)this.buf.push(c[i]);if(this.buf.length>=1600){this.port.postMessage(Float32Array.from(this.buf));this.buf.length=0}}return true}}registerProcessor("pcm",P)`;
    await this.micCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([code],{type:"application/javascript"})));
    this.micNode=new AudioWorkletNode(this.micCtx,"pcm");
    this.micNode.port.onmessage=(e)=>send(e.data);
    src.connect(this.micNode);
   }catch(err){
    this.micNode=this.micCtx.createScriptProcessor(4096,1,1);
    src.connect(this.micNode);this.micNode.connect(this.micCtx.destination);
    this.micNode.onaudioprocess=(e)=>send(e.inputBuffer.getChannelData(0));
   }
   return true;
  }catch(e){log("mic error: "+e.message);return false}
 }
 // Browsers create AudioContexts "suspended" unless born in a user gesture.
 // Called from clicks/keypresses so mic capture and playback actually run.
 async unlock(){
  try{
   if(!this.playCtx)this.playCtx=new AudioContext({sampleRate:24000});
   if(this.playCtx.state==="suspended")await this.playCtx.resume();
   if(this.micCtx&&this.micCtx.state==="suspended")await this.micCtx.resume();
  }catch(e){}
 }
 connect(systemPrompt,tools){
  return new Promise((resolve,reject)=>{
   const proto=location.protocol==="https:"?"wss":"ws";
   const ws=new WebSocket(`${proto}://${location.host}/live`);
   this.ws=ws;this.intentional=false;
   const sock=ws; // stale-socket guard
   let settled=false;
   const to=setTimeout(()=>{if(!settled){settled=true;try{ws.close()}catch(e){};reject(new Error("timeout"))}},12000);
   ws.onopen=()=>{
    ws.send(JSON.stringify({setup:{
     model:CFG.liveModel,
     generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:CFG.voice||"Orus"}}}},
     systemInstruction:{parts:[{text:systemPrompt}]},
     tools:[{functionDeclarations:tools}],
     outputAudioTranscription:{},inputAudioTranscription:{},
     // interruptions stay ON so the trainee's speech is handled immediately;
     // echo is prevented client-side (mic gated while Saif's audio is playing)
    }}));
   };
   ws.onmessage=async(ev)=>{
    if(this.ws!==sock)return;
    const m=JSON.parse(typeof ev.data==="string"?ev.data:await ev.data.text());
    if(m.setupComplete!==undefined){if(!settled){settled=true;clearTimeout(to);resolve()}return}
    if(m.serverContent){
     const sc=m.serverContent;
     if(this.onActivity)this.onActivity(); // lets watchdogs measure real silence, not turn length
     if(sc.interrupted){this.stopPlayback();if(this.onText)this.onText("",true);return} // count as turn end so queues never freeze
     for(const p of (sc.modelTurn?.parts||[])){
      if(p.inlineData?.data)this.enqueueAudio(p.inlineData.data);
     }
     if(sc.outputTranscription?.text&&this.onText)this.onText(sc.outputTranscription.text,!!sc.turnComplete);
     if(sc.inputTranscription?.text&&this.onUserText)this.onUserText(sc.inputTranscription.text);
     if(sc.turnComplete&&this.onText)this.onText("",true);
    }
    if(m.toolCall&&this.onTool){
     for(const fc of m.toolCall.functionCalls||[]){
      const resp=await this.onTool(fc.name,fc.args||{});
      if(this.ws&&this.ws.readyState===1)
       this.ws.send(JSON.stringify({toolResponse:{functionResponses:[{id:fc.id,name:fc.name,response:resp||{ok:true}}]}}));
     }
    }
   };
   ws.onerror=()=>{if(this.ws!==sock)return;if(!settled){settled=true;clearTimeout(to);reject(new Error("ws error"))}};
   ws.onclose=(e)=>{if(!settled){settled=true;clearTimeout(to);reject(new Error("closed "+e.code))}
    else if(this.ws===sock&&!this.intentional){log(`live closed ${e.code} ${e.reason||""}`);if(this.onClose)this.onClose(e)}};
  });
 }
 sendText(t){if(this.ws&&this.ws.readyState===1)this.ws.send(JSON.stringify({clientContent:{turns:[{role:"user",parts:[{text:t}]}],turnComplete:true}}))}
 enqueueAudio(b64){
  if(!this.playCtx)this.playCtx=new AudioContext({sampleRate:24000});
  if(this.playCtx.state==="suspended")this.playCtx.resume();
  const bin=atob(b64);const n=bin.length/2;
  const f=new Float32Array(n);
  for(let i=0;i<n;i++){let v=bin.charCodeAt(i*2)|(bin.charCodeAt(i*2+1)<<8);if(v>=0x8000)v-=0x10000;f[i]=v/0x8000}
  const buf=this.playCtx.createBuffer(1,n,24000);
  buf.getChannelData(0).set(f);
  const src=this.playCtx.createBufferSource();src.buffer=buf;src.connect(this.playCtx.destination);
  // jitter buffer: give a fresh turn a 250ms head start so slow-arriving chunks
  // don't underrun (that underrun was the "breaking/choppy" voice); mid-stream
  // underruns re-cushion with 60ms instead of clicking straight in
  const lead=this.sources.length?.06:.25;
  const t0=Math.max(this.playCtx.currentTime+lead,this.playCursor);
  src.start(t0);this.playCursor=t0+buf.duration;
  this.sources.push(src);src.onended=()=>{this.sources=this.sources.filter(s=>s!==src)};
 }
 stopPlayback(){for(const s of this.sources){try{s.stop()}catch(e){}}this.sources=[];this.playCursor=0}
 get speaking(){return this.sources.length>0}
 close(){this.intentional=true;this.stopPlayback();if(this.ws){try{this.ws.close()}catch(e){};this.ws=null}}
 destroy(){this.close();if(this.micStream){this.micStream.getTracks().forEach(t=>t.stop());this.micStream=null}
  if(this.micCtx){try{this.micCtx.close()}catch(e){}this.micCtx=null;this.micNode=null}
  if(this.playCtx){try{this.playCtx.close()}catch(e){}this.playCtx=null;this.playCursor=0}}
}

/* ---------- effects: particles + floating score ---------- */
const bursts=[];
function burst(worldPos,ok){
 const n=42,pos=new Float32Array(n*3),vel=[];
 for(let i=0;i<n;i++){pos[i*3]=worldPos.x;pos[i*3+1]=worldPos.y;pos[i*3+2]=worldPos.z;
  vel.push(new THREE.Vector3((Math.random()-.5)*3,(Math.random()*.9+.4)*3,(Math.random()-.5)*3))}
 const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(pos,3));
 const m=new THREE.PointsMaterial({color:ok?0x1fa877:0xd84a38,size:.09,transparent:true,opacity:.95});
 const pts=new THREE.Points(g,m);scene.add(pts);
 bursts.push({pts,vel,t:0});
 if(ok){const chip=textPanel("+5",1,.55,{size:52,bold:true,color:"#ffffff",bg:"rgba(31,168,119,0.95)",border:"rgba(0,0,0,0)"});
  chip.position.copy(worldPos).add(new THREE.Vector3(0,.4,0));scene.add(chip);
  bursts.push({chip,t:0})}
}
function fxTick(dt){
 for(let i=bursts.length-1;i>=0;i--){const b=bursts[i];b.t+=dt;
  if(b.pts){const p=b.pts.geometry.attributes.position;
    for(let k=0;k<b.vel.length;k++){p.array[k*3]+=b.vel[k].x*dt;p.array[k*3+1]+=b.vel[k].y*dt;p.array[k*3+2]+=b.vel[k].z*dt;b.vel[k].y-=4.5*dt}
    p.needsUpdate=true;b.pts.material.opacity=Math.max(0,.95-b.t*1.2);
    if(b.t>1){scene.remove(b.pts);bursts.splice(i,1)}}
  else if(b.chip){b.chip.position.y+=dt*.9;b.chip.material.opacity=Math.max(0,1-b.t*.8);b.chip.lookAt(camPos);
    if(b.t>1.4){scene.remove(b.chip);bursts.splice(i,1)}}}
 for(let i=flights.length-1;i>=0;i--){const f=flights[i];f.t+=dt/f.dur;
  if(f.t>=1){f.obj.position.copy(f.to);flights.splice(i,1)}
  else f.obj.position.lerp(f.to,Math.min(1,dt*9))}
}

// A tilted console desk in front of the trainee: question header on top,
// numbered option tiles docked in slots on the glass deck.
function dockPlace(meshes,promptText,headerY=3.35){
 const n=meshes.length;
 const cols=Math.min(3,n<=3?n:Math.ceil(n/2)), rows=Math.ceil(n/cols);
 const tilt=-0.52, deckPos=new THREE.Vector3(0,1.12,2.3);
 const dw=cols*2.42+.5, dh=rows*1.08+.35;
 const deckG=new THREE.Group();
 // opaque deck: a transparent deck under transparent tiles made the renderer
 // flip their draw order every frame (visible flicker)
 const deck=new THREE.Mesh(new THREE.BoxGeometry(dw,dh,.07),
   new THREE.MeshStandardMaterial({color:0x0f3237,roughness:.4,metalness:.3}));
 deck.renderOrder=1;
 deckG.add(deck);
 const rim=new THREE.Mesh(new THREE.BoxGeometry(dw+.14,dh+.14,.03),mat(TEAL,TEAL,.7));
 rim.position.z=-.035;rim.renderOrder=0;deckG.add(rim);
 deckG.position.copy(deckPos);deckG.rotation.x=tilt;
 qGroup.add(deckG);
 box(qGroup,.14,1.06,.14,0x2a3f45,-dw/2+.4,.53,2.3);
 box(qGroup,.14,1.06,.14,0x2a3f45,dw/2-.4,.53,2.3);
 if(promptText){
   const head=textPanel(promptText,7.4,1.1,{size:33,bold:true,color:"#ffffff",bg:"rgba(15,50,55,0.94)",border:"rgba(53,167,154,0.7)"});
   head.position.set(0,headerY,0.5);qGroup.add(head);
 }
 const e=new THREE.Euler(tilt,0,0);
 meshes.forEach((m,k)=>{
   const v=new THREE.Vector3((k%cols-(cols-1)/2)*2.42,((rows-1)/2-Math.floor(k/cols))*1.08,.14);
   v.applyEuler(e).add(deckPos);
   m.position.copy(v);m.rotation.x=tilt;m.renderOrder=10;
   m.userData.home=m.position.clone();m.userData.dockTilt=tilt;
   qGroup.add(m);
 });

}

function playBeat(stIdx,q,onDone){
 const w=widgetOf(q);
 const dis=realDis(q);
 hostFlush(); // drop narration for beats the trainee has already moved past
 if(w==="conv"){stageConv(stIdx,q,onDone);return}
 const INSTR={single:"instrSingle",multi:"instrMulti",sequence:"instrSeq",hotsingle:"instrHot",hotmulti:"instrHotM",assign:"instrAssign"};
 speak(L(q.prompt)+" — "+T(INSTR[w]||"instrSingle"),T("saif"),L(q.prompt));
 const g=stageBase(stIdx);
 const finish=(ok,at)=>{score(q,ok,at);setTimeout(()=>onDone(),1100)};

 if(w==="single"||w==="multi"){
   /* -------- drag tiles from the console onto the answer pad -------- */
   const items=shuffled(q.correct.concat(dis),rng(S.seed+hash(q.id)));
   const pad=makePad(g,w==="single"?T("padPlace"):T("padCollect"),w==="multi");
   pad.grp.position.set(-4.9,0,1.2);
   const onPad=new Set();
   const cards=items.map((o,ix)=>{const m=tileMesh(L(o),ix+1);m.userData.ix=ix;return m});
   dockPlace(cards,L(q.prompt));
   const relayout=()=>{ // arrange tiles resting upright on the pad
     const on=[...onPad];
     on.forEach((ix,k)=>{const m=cards.find(c=>c.userData.ix===ix);
       const a=(k-(on.length-1)/2)*.8;
       m.rotation.x=0;
       flyBack(m,new THREE.Vector3(pad.grp.position.x+a,1.0,pad.grp.position.z));
       m.userData.onPad=true});
   };
   let confirmBtn=null;
   if(w==="multi"){
     confirmBtn=textPanel(T("confirm"),1.9,.72,{size:40,bold:true,color:"#ffffff",bg:"rgba(0,115,106,0.96)",border:"#005a53"});
     confirmBtn.position.set(-4.9,2.2,1.2);confirmBtn.visible=false;g.add(confirmBtn);
     confirmBtn.userData.onClick=()=>{
       const chosen=[...onPad].map(i=>items[i].en).sort();
       const want=q.correct.map(c=>c.en).sort();
       finish(chosen.length===want.length&&chosen.every((v,i)=>v===want[i]),pad.grp.position.clone().add(new THREE.Vector3(0,1,0)));
     };
   }
   pad.catcher.userData.onDrop=o=>{
     if(w==="single"){
       o.rotation.x=0;
       flyBack(o,new THREE.Vector3(pad.grp.position.x,1.0,pad.grp.position.z));
       setInteract([],[],[]);
       setTimeout(()=>finish(q.correct.some(c=>c.en===items[o.userData.ix].en),pad.grp.position.clone().add(new THREE.Vector3(0,1,0))),450);
       return true;
     }
     o.rotation.x=0;
     onPad.add(o.userData.ix);relayout();
     confirmBtn.visible=onPad.size>0;
     return true;
   };
   // dragging a tile off the pad returns it to its console slot (multi only)
   const offDrop=o=>{if(o.userData.onPad){onPad.delete(o.userData.ix);o.userData.onPad=false;
     o.rotation.x=o.userData.dockTilt;flyBack(o,o.userData.home);relayout();
     confirmBtn&&(confirmBtn.visible=onPad.size>0);return true}return false};
   const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshBasicMaterial({visible:false}));
   ground.rotation.x=-Math.PI/2;ground.position.y=.05;g.add(ground);
   ground.userData.onDrop=offDrop;
   // simpler path: a plain click on a tile sends it to the pad (or back off it)
   cards.forEach(m=>{m.userData.onClick=()=>{
     if(m.userData.onPad)offDrop(m);
     else pad.catcher.userData.onDrop(m);
   }});
   setInteract(confirmBtn?[confirmBtn]:[],cards,[pad.catcher,ground]);

 }else if(w==="sequence"){
   /* -------- touch console tiles in order; a light path follows -------- */
   const items=shuffled(q.correct.concat(dis),rng(S.seed+hash(q.id)));
   const hint=textPanel(T("seqHint"),6.4,.62,{size:28,color:"#61707a",bg:"rgba(255,255,255,0.85)",border:"rgba(0,0,0,0)"});
   hint.position.set(0,.4,4.1);g.add(hint);
   const seq=[];
   const cards=items.map((o,ix)=>{const m=cardMesh(L(o),2.2,.9);
     m.userData.onClick=()=>{if(seq.includes(ix))return;
       seq.push(ix);
       m.userData.setText(seq.length+". "+L(o),{border:"#1fa877",bg:"rgba(234,250,244,0.97)"});
       beep(true);
       if(seq.length>1){ // draw glowing link from previous tile
         const a=cards[seq[seq.length-2]].position,b=m.position;
         const mid=a.clone().add(b).multiplyScalar(.5);
         const len=a.distanceTo(b);
         const tube=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,len,10),
           new THREE.MeshBasicMaterial({color:TEALL,transparent:true,opacity:.85}));
         tube.position.copy(mid);
         tube.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.clone().sub(a).normalize());
         g.add(tube);
       }
       if(seq.length===q.correct.length){
         const chosen=seq.map(i=>items[i].en);const want=q.correct.map(c=>c.en);
         setTimeout(()=>finish(chosen.every((v,i)=>v===want[i]),m.position.clone()),400);
       }};
     return m});
   dockPlace(cards,L(q.prompt));
   setInteract(cards,[],[]);

 }else if(w==="hotsingle"||w==="hotmulti"){
   /* -------- hotspots on an image board (map / wall) -------- */
   const isMap=/map/i.test(q.prompt.en)||q.id==="S1-Q4";
   const board=new THREE.Mesh(new THREE.PlaneGeometry(7.6,4.3),new THREE.MeshBasicMaterial({color:0xffffff}));
   board.position.set(0,2.55,-3.4);g.add(board);
   const frame=new THREE.Mesh(new THREE.BoxGeometry(7.9,4.6,.08),mat(TEAL,TEAL,.35));
   frame.position.set(0,2.55,-3.46);g.add(frame);
   if(isMap)loadTex("img/uae-map.jpg",t=>{board.material.map=t;board.material.needsUpdate=true});
   const hint=textPanel(T("hotHint"),6.4,.62,{size:28,color:"#61707a",bg:"rgba(255,255,255,0.85)",border:"rgba(0,0,0,0)"});
   hint.position.set(0,.5,-.6);g.add(hint);
   const items=shuffled(q.correct.concat(dis),rng(S.seed+hash(q.id)));
   // stable spread across the board
   const spots=shuffled(items.map((_,k)=>k),rng(S.seed+hash(q.id+"pos")));
   const cols=Math.ceil(items.length/2);
   const sel=new Set();
   let confirmBtn=null;
   const markers=items.map((o,ix)=>{
     const slot=spots[ix];
     const cx=((slot%cols)-(cols-1)/2)*(6.6/cols);
     const cy=slot<cols?3.35:1.9;
     const grpM=new THREE.Group();
     const ringM=new THREE.Mesh(new THREE.RingGeometry(.14,.22,32),new THREE.MeshBasicMaterial({color:TEAL,transparent:true,opacity:.95,side:THREE.DoubleSide}));
     grpM.add(ringM);grpM.userData.pulse=ringM;
     const dot=new THREE.Mesh(new THREE.CircleGeometry(.09,20),new THREE.MeshBasicMaterial({color:TEAL}));
     dot.position.z=.005;grpM.add(dot);
     const lbl=textPanel(L(o),2.15,.72,{size:26});
     lbl.position.set(0,-.62,.01);grpM.add(lbl);
     grpM.position.set(cx,cy,-3.32);
     g.add(grpM);
     dot.userData.hitIx=ix;
     lbl.userData.hitIx=ix;
     const toggle=()=>{
       if(w==="hotsingle"){setInteract([],[],[]);
         setTimeout(()=>finish(q.correct.some(c=>c.en===items[ix].en),grpM.position.clone()),350);return}
       sel.has(ix)?sel.delete(ix):sel.add(ix);
       const on=sel.has(ix);
       ringM.material.color.set(on?SAND:TEAL);dot.material.color.set(on?SAND:TEAL);
       lbl.userData.setText((on?"● ":"")+L(o),{border:on?"#c8a45a":"#00736a"});
       confirmBtn.visible=sel.size>0;
     };
     dot.userData.onClick=toggle;lbl.userData.onClick=toggle;
     return {dot,lbl};
   });
   const clickables=markers.flatMap(m=>[m.dot,m.lbl]);
   if(w==="hotmulti"){
     confirmBtn=textPanel(T("confirm"),1.9,.72,{size:40,bold:true,color:"#ffffff",bg:"rgba(0,115,106,0.96)",border:"#005a53"});
     confirmBtn.position.set(3.4,1.1,-1.4);confirmBtn.visible=false;g.add(confirmBtn);
     confirmBtn.userData.onClick=()=>{
       const chosen=[...sel].map(i=>items[i].en).sort();
       const want=q.correct.map(c=>c.en).sort();
       finish(chosen.length===want.length&&chosen.every((v,i)=>v===want[i]),new THREE.Vector3(0,2.5,-3.2));
     };
     clickables.push(confirmBtn);
   }
   setInteract(clickables,[],[]);

 }else{ /* -------- assign: drag cards onto zone boards -------- */
   const cardsData=q.correct.concat(dis).map(o=>{const pe=o.en.split("→").map(s=>s.trim());
     const pa=(o.ar||o.en).split("→").map(s=>s.trim());
     return{en:pe[0],ar:pa[0]||pe[0],zoneEn:/matches nothing/i.test(pe[1]||"")?"__none__":(pe[1]||""),zoneAr:pa[1]||""}});
   const zones=[];cardsData.forEach(c=>{if(c.zoneEn!=="__none__"&&!zones.some(z=>z.en===c.zoneEn))zones.push({en:c.zoneEn,ar:c.zoneAr})});
   if(cardsData.some(c=>c.zoneEn==="__none__"))zones.push({en:"__none__",ar:""});
   const order=shuffled(cardsData.map((c,i)=>i),rng(S.seed+hash(q.id)));
   const assign={};
   const zlabel=z=>z.en==="__none__"?T("notUsed"):(LANG==="ar"&&z.ar?z.ar:z.en);
   // draggable tiles docked on the console
   const cardM=order.map((ci,k)=>{const c=cardsData[ci];const m=tileMesh(LANG==="ar"?c.ar:c.en,k+1);
     m.userData.ci=ci;
     m.userData.onReturn=o=>{ // dragged off a zone and dropped nowhere: unassign
       const prev=assign[o.userData.ci];
       if(prev!=null){delete assign[o.userData.ci];
         const pz=zoneM[prev];pz.grpZ.userData.stack=pz.grpZ.userData.stack.filter(x=>x!==o);restack(pz);
         o.scale.setScalar(1);o.userData.baseScale=1}
     };
    return m});
  dockPlace(cardM,L(q.prompt),4.5);
  // zone boards standing in a row
   const zw=2.9;
   const zoneM=zones.map((z,zi)=>{
     const grpZ=new THREE.Group();
     const back=new THREE.Mesh(new THREE.BoxGeometry(zw,2.5,.1),mat(0xffffff));
     back.position.y=1.25;grpZ.add(back);
     const head=textPanel(zlabel(z),zw-.15,.62,{size:30,bold:true,color:"#ffffff",bg:"rgba(0,115,106,0.96)",border:"#005a53"});
     head.position.set(0,2.22,.07);grpZ.add(head);
     const slotsLbl=textPanel(T("dropZone"),zw-.5,.5,{size:24,color:"#9aa7ad",bg:"rgba(244,247,248,0.9)",border:"rgba(0,0,0,0)"});
     slotsLbl.position.set(0,1.0,.07);grpZ.add(slotsLbl);grpZ.userData.slotsLbl=slotsLbl;
     // raised above the console deck — at floor level they were hidden behind it
    grpZ.position.set(-((zones.length-1)/2)*(zw+.35)+zi*(zw+.35),1.35,-1.6);
     g.add(grpZ);
     back.userData.zi=zi;grpZ.userData.stack=[];
     back.userData.setHot=h=>{back.material.emissive=new THREE.Color(h?TEAL:0x000000);back.material.emissiveIntensity=h?.35:0};
     back.userData.onDrop=o=>{
       const prev=assign[o.userData.ci];
       if(prev!=null){const pz=zoneM[prev];pz.grpZ.userData.stack=pz.grpZ.userData.stack.filter(x=>x!==o);restack(pz)}
       assign[o.userData.ci]=zi;
       grpZ.userData.stack.push(o);restack({grpZ,back});
       grpZ.userData.slotsLbl.visible=false;
       if(Object.keys(assign).length===cardsData.length){
         setInteract([],[],[]);
         setTimeout(()=>{
           const ok=cardsData.every((c,ci)=>{const z=zones[assign[ci]];return z&&(c.zoneEn==="__none__"?z.en==="__none__":z.en===c.zoneEn)});
           finish(ok,grpZ.position.clone().add(new THREE.Vector3(0,1.6,0)));
         },500);
       }
       return true;
     };
     return {grpZ,back};
   });
  function restack(z){
    z.grpZ.userData.stack.forEach((m,k)=>{
      m.scale.setScalar(.72);m.userData.baseScale=.72;m.rotation.x=0;
      flyBack(m,z.grpZ.position.clone().add(new THREE.Vector3(0,1.72-k*.55,.14)));
    });
    if(!z.grpZ.userData.stack.length&&z.grpZ.userData.slotsLbl)z.grpZ.userData.slotsLbl.visible=true;
  }
  // simpler path: click a tile to select it, then click a zone board to place it
  let selTile=null;
  const setSel=m=>{
    if(selTile){selTile.userData.baseScale=selTile.userData.selPrev||1;selTile.scale.setScalar(selTile.userData.baseScale);
      selTile.userData.setText(selTile.userData.label)}
    selTile=m;
    if(m){m.userData.selPrev=m.userData.baseScale||1;m.userData.baseScale=m.userData.selPrev*1.16;m.scale.setScalar(m.userData.baseScale);
      m.userData.setText(m.userData.label,{border:"#d7b56d"})} // gold border marks the selected card
    zoneM.forEach(z=>z.back.userData.setHot(!!m));
  };
  cardM.forEach(m=>{m.userData.onClick=()=>setSel(selTile===m?null:m)});
  zoneM.forEach(z=>{z.back.userData.onClick=()=>{
    if(selTile){const m=selTile;setSel(null);z.back.userData.onDrop(m)}
  }});
  setInteract(zoneM.map(z=>z.back),cardM,zoneM.map(z=>z.back));
 }
}

/* ---------- conversational beat + push-to-talk ---------- */
let recog=null,recActive=false,convOpen=false,curSubmit=null,liveActive=false;
function recStart(){
 if(recActive||!convOpen||liveActive)return;
 const stat=document.getElementById("convstat");
 const talk=document.getElementById("talk");
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){stat.style.display="block";stat.textContent=T("mic_no");return}
 if(!window.isSecureContext){stat.style.display="block";stat.textContent=T("mic_ctx");return}
 try{
   recog=new SR();recog.lang=LANG==="ar"?"ar-SA":"en-US";recog.interimResults=false;
   recog.onresult=ev=>{const tx=ev.results[0][0].transcript;if(curSubmit)curSubmit(tx)};
   recog.onerror=e=>{stat.style.display="block";stat.textContent=T("mic_no")+" ("+e.error+")";talk.classList.remove("rec");recActive=false};
   recog.onend=()=>{talk.classList.remove("rec");recActive=false};
   recog.start();recActive=true;
   talk.classList.add("rec");
   stat.style.display="block";stat.textContent=T("listening");
 }catch(e){stat.style.display="block";stat.textContent=T("mic_no")}
}
function recStop(){try{recog&&recog.stop()}catch(e){};document.getElementById("talk").classList.remove("rec");recActive=false}
/* Push-to-talk: opens the live host's mic anywhere in the session, so the
   trainee can ask "what shall I do now?" and Saif answers with full context. */
let pttOpen=false,pttTimer=null;
async function pttDown(){
 if(pttOpen)return;
 if(!HOST.on&&HOST.failed<9)HOST.failed=0; // user-initiated: always worth another try
 if(!VOICE_ON||!(await hostEnsure())){subtitle(T("saif"),T("ai_no"));return}
 pttOpen=true;clearTimeout(pttTimer);
 live.muted=false;live.hot=true;
 live.stopPlayback(); // barge-in: talking over Saif stops him
 HOST.hold=Date.now(); // pause queued narration until Saif has answered the trainee
 document.getElementById("askmic").classList.add("rec");
 vrHud.setMic(true);
 const st=document.getElementById("convstat");st.style.display="block";st.textContent=T("listenLive");
}
function pttUp(){
 if(!pttOpen)return;pttOpen=false;
 document.getElementById("askmic").classList.remove("rec");
 vrHud.setMic(false);
 // short tail so the end of the sentence is captured before muting
 pttTimer=setTimeout(()=>{
  live.hot=false;
  if(!liveActive)live.muted=true; // stay open if a verbal question is running
  const st=document.getElementById("convstat");
  if(!convOpen)st.style.display="none";
 },900);
 setTimeout(hostPump,15500); // if no reply ever arrives, narration resumes after the hold expires
}

async function stageConv(stIdx,q,onDone){
 stageBase(stIdx);
 const conv=document.getElementById("conv");
 const stat=document.getElementById("convstat");
 const sp=document.getElementById("spacehint");
 const talk=document.getElementById("talk");
 const who=q.id==="S5-Q3"?T("visitor"):T("saif");
 subtitle(who,L(q.prompt),true);
 document.getElementById("convopts").textContent=T("showOpts");
 document.getElementById("convin").value="";
 document.getElementById("convin").placeholder=T("typeHint");
 const cleanup=()=>{conv.style.display="none";stat.style.display="none";sp.style.display="none";convOpen=false;curSubmit=null;liveActive=false;live.muted=true;HOST.who=null};
 const fallback=()=>{cleanup();
   subtitle(who,L(q.prompt),true);
   const dis=realDis(q);const items=shuffled(q.correct.concat(dis),rng(S.seed+hash(q.id)));
   const cards=items.map((o,ix)=>{const m=tileMesh(L(o),ix+1);
     m.userData.onClick=()=>{score(q,q.correct.some(c=>c.en===items[ix].en),m.position.clone());setTimeout(()=>onDone(),1100)};return m});
   dockPlace(cards,L(q.prompt));setInteract(cards,[],[])};
 if(!hasAI()){stat.style.display="block";stat.textContent=T("key_no");setTimeout(fallback,50);return}
 const finish=(ok)=>{cleanup();score(q,ok,undefined,true);setTimeout(()=>onDone(),1100)};

 /* ---- verbal moment through the persistent live host session ---- */
 if(VOICE_ON&&await hostEnsure()){
   let judged=false,guard=null,hardTo=null;
   const stop=()=>{clearInterval(guard);clearTimeout(hardTo)};
   HOST.who=who;
   HOST.onScore=(args)=>{if(judged)return;judged=true;stop();
     live.muted=true;HOST.who=null;
     if(args.feedback)subtitle(T("saif"),args.feedback,true);
     setTimeout(()=>finish(!!args.correct),2600)};
  const exp=q.correct.map(c=>L(c)).join(" / ");
  const wrong=realDis(q).map(d=>L(d)).join(" / ");
  HOST.lastUser=0;
  hostSay(`${q.id==="S5-Q3"?"For this one, roleplay a VISITOR at the reception desk. ":""}Assessment question: "${L(q.prompt)}" | Correct idea: ${exp} | Wrong ideas (do not accept): ${wrong}`,"ASK");
  stat.style.display="block";stat.textContent=T("listenLive");
  conv.style.display="flex";convOpen=true;liveActive=true; // shows only the "Show choices" escape hatch
  document.getElementById("convopts").onclick=()=>{if(judged)return;stop();HOST.onScore=null;fallback()};
  // resilience: if the voice session dies or stalls, switch to clickable choices
  const bail=()=>{if(judged)return;judged=true;stop();HOST.onScore=null;
    stat.textContent=T("ai_no");setTimeout(fallback,500)};
  let nudged=false;
  guard=setInterval(()=>{
    if(!HOST.on||!live.ws||live.ws.readyState!==1){bail();return}
    // model replied to the answer but forgot the score_answer call → remind it once
    if(!nudged&&HOST.onScore&&!live.speaking&&HOST.lastUser
       &&Date.now()-HOST.lastUser>6000&&Date.now()-HOST.lastAct>6000){
      nudged=true;live.sendText("[NUDGE] The trainee already answered. Call score_answer NOW with your verdict on that answer, and say one short feedback sentence.");
    }
  },3000);
  hardTo=setTimeout(bail,45000);
   return;
 }

 // no robotic-TTS path: if live voice is unavailable, show the choices instead
 stat.style.display="block";stat.textContent=T("ai_no");
 setTimeout(fallback,400);
}

/* ================= session flow ================= */
function startSession(name){
 const prev=DB.results.filter(r=>r.trainee===name&&r.level===1).length;
 S={trainee:name,seed:hash(name+"|adc-poc"),attempt:prev+1,score:0,done:0,answers:[],active:true,st:0};
 S.plan=draw(S.attempt);
 log(`session.start · ${name} · ${LANG} · attempt ${S.attempt}`);
 document.getElementById("startOv").style.display="none";
 document.getElementById("ctrlhint").textContent=T("hint");
 hud();
 toggleAsk(true); // chat bar with mic stays visible for the whole session
 const sh=document.getElementById("spacehint");sh.style.display="block";sh.textContent=T("holdSpace2");
 hostReset(); // fresh voice session with this trainee's name and language
 // the journey begins ON the central medallion: Saif waits there, greets,
 // explains the scope, then WALKS to station one — the trainee follows him
 followSt=null;glide=null;
 camPos.set(0,1.6,5);yaw=0;pitch=0;
 saif.position.set(.6,0,1.4);saifTarget=new THREE.Vector3(.6,0,1.4);
 stations.forEach(s=>s.group.userData.beam.visible=false);
 let went=false;const go=()=>{if(went)return;went=true;escortTo(0)};
 speak(T("welcome").replace("{name}",name),T("saif"));
 speak(T("introScope"),T("saif"),null,go); // Saif sets off once the briefing is spoken
 setTimeout(go,30000); // failsafe: never strand the trainee at the medallion
 if(FAST)go();
}
/* Saif escorts, the trainee walks — no auto-moving the player. Arrival at the
   beacon (tracked in the render loop) starts the station. */
let followSt=null;
function escortTo(i){
 S.st=i;
 stations.forEach((s,k)=>{s.group.userData.beam.visible=k===i});
 const a=stationAngle(i);
 saifTarget=new THREE.Vector3(Math.sin(a)*(R-5.4)+Math.cos(a)*1.8,0,-Math.cos(a)*(R-5.4)+Math.sin(a)*1.8);
 if(FAST){glideTo(i);beginStation(i);return}
 hostFlush();
 speak(T(i===0?"followMe":"followNext"),T("saif"));
 followSt=i;
}
function beginStation(i){
 followSt=null;
 hostFlush();live.stopPlayback(); // fresh start at each station: skip stale narration audio
 speak(T("stationIntro")[i],T("saif"));
 setTimeout(()=>runBeat(i,0),FAST?350:2200);
}
function runBeat(i,b){
 if(b>=4){ if(i+1<6)escortTo(i+1); else endLevel(); return }
 const {q}=S.plan[i][b];
 playBeat(i,q,()=>runBeat(i,b+1));
}
function endLevel(){
 followSt=null;
 clearQ();
 const pass=S.score>=96;
 speak(T(pass?"resPass":"resFail").replace("{name}",S.trainee).replace("{score}",String(S.score)),T("saif"));
 DB.results.push({trainee:S.trainee,level:1,attempt:S.attempt,score:S.score,pass,lang:LANG,ts:new Date().toISOString(),answers:S.answers});
 save();log(`level.result · ${S.trainee} · ${S.score}/120 · ${pass?"PASS":"FAIL"}`);
 S.active=false;hud();
 document.getElementById("roEyebrow").textContent=T("eyebrow");
 document.getElementById("roScore").textContent=S.score+" / 120";
 document.getElementById("roScore").className="big "+(pass?"pass":"fail");
 document.getElementById("roVerdict").textContent=pass?T("passed"):T("failed");
 document.getElementById("roVerdict").className=pass?"pass":"fail";
 const rr=document.getElementById("roRetry");
 rr.style.display=pass?"none":"";rr.textContent=T("retry");
 rr.onclick=()=>{document.getElementById("resultOv").style.display="none";startSession(S.trainee)};
 document.getElementById("roHome").textContent=T("home");
 document.getElementById("roHome").onclick=()=>{document.getElementById("resultOv").style.display="none";hostReset();showStart()};
 document.getElementById("resultOv").style.display="flex";
}

/* ---------- start overlay ---------- */
function lvState(n){
 if(n===1)return"open";
 const passed=DB.results.some(r=>r.pass&&r.level===1);
 if(n===2&&(passed||DB.bypass))return DB.bypass&&!passed?"bypassed":"open";
 return"locked";
}
function showStart(){
 if(PARAMS.has("autostart")&&!autoStarted){
   autoStarted=true;
   LANG=PARAMS.get("lang")==="ar"?"ar":"en";
   document.documentElement.dir=LANG==="ar"?"rtl":"ltr";
   document.getElementById("startOv").style.display="none";
   startSession(PARAMS.get("name")||"Demo");
   return;
 }
 const so=document.getElementById("startOv");so.style.display="flex";
 toggleAsk(false);document.getElementById("spacehint").style.display="none";
 document.getElementById("soEyebrow").textContent=T("eyebrow");
 document.getElementById("bcSub").textContent=T("eyebrow");
 document.getElementById("soTitle").textContent=T("title");
 document.getElementById("soDesc").textContent=T("desc");
 document.getElementById("soNameL").textContent=T("name");
 document.getElementById("soLangL").textContent=T("lang");
 document.getElementById("soLvlL").textContent=T("lvl");
 document.getElementById("soHint").textContent=T("hint");
 document.getElementById("inName").value=DB.lastName||"";
 const g=document.getElementById("lvGrid");
 g.innerHTML=[1,2,3,4,5].map(n=>{const st=lvState(n);
  return`<div class="level ${st}" data-lv="${n}"><div class="num">${n}</div><div class="st">${st==="locked"?"🔒 "+T("locked"):(st==="bypassed"?"🔓":T("open"))}</div></div>`}).join("");
 g.querySelectorAll(".level.open,.level.bypassed").forEach(el=>el.onclick=()=>{
   const nm=document.getElementById("inName").value.trim();
   if(!nm){document.getElementById("inName").focus();return}
   DB.lastName=nm;save();
   if(+el.dataset.lv===1){so.style.display="none";startSession(nm)}
   else{so.style.display="none";subtitle(T("saif"),T("l2"));setTimeout(showStart,4200)}
 });
}
document.querySelectorAll(".langbtn").forEach(b=>b.onclick=()=>{
 LANG=b.dataset.l;
 document.documentElement.dir=LANG==="ar"?"rtl":"ltr";
 document.querySelectorAll(".langbtn").forEach(x=>x.classList.toggle("sel",x===b));
 showStart();
});

/* ---------- ask Saif (always-on chat bar with push-to-talk mic) ---------- */
function toggleAsk(on){const r=document.getElementById("askrow");
 r.style.display=on?"flex":"none";
 if(on){const i=document.getElementById("askin");i.placeholder=T("askPh")}}
document.getElementById("btnAsk").onclick=()=>{toggleAsk(true);document.getElementById("askin").focus()};
{const am=document.getElementById("askmic");
 am.onpointerdown=()=>pttDown();
 am.onpointerup=()=>pttUp();
 am.onpointerleave=()=>pttUp();}
const btnVoice=document.getElementById("btnVoice");
const paintVoice=()=>btnVoice.textContent=VOICE_ON?"🔊":"🔇";
btnVoice.onclick=()=>{VOICE_ON=!VOICE_ON;localStorage.setItem("adc_voice",VOICE_ON?"on":"off");
 if(!VOICE_ON){HOST.q.length=0;live.stopPlayback()}paintVoice()};
paintVoice();
async function doAsk(){const i=document.getElementById("askin");const t=i.value.trim();if(!t)return;
 i.value="";subtitle(T("you"),t);
 if(VOICE_ON&&HOST.on&&live.ws&&live.ws.readyState===1){HOST.hold=Date.now();live.sendText(t);return} // Saif answers in his own voice; narration waits
 try{const r=await askSaif(t);subtitle(T("saif"),r.trim())}catch(e){subtitle(T("saif"),e.message==="nokey"?T("key_no"):T("ai_no"))}}
document.getElementById("asksend").onclick=doAsk;
document.getElementById("askin").addEventListener("keydown",e=>{if(e.key==="Enter")doAsk()});

/* ---------- admin ---------- */
let adminAuthed=false;
document.getElementById("btnAdmin").onclick=()=>{document.getElementById("drawer").classList.add("open");paintAdmin()};
document.getElementById("dClose").onclick=()=>document.getElementById("drawer").classList.remove("open");
function paintAdmin(){
 if(!document.getElementById("drawer").classList.contains("open"))return;
 const body=document.getElementById("dBody");
 if(!adminAuthed){
  body.innerHTML=`<label>${T("pin")}</label><input id="pin" type="password" style="max-width:150px">
   <div style="margin-top:10px"><button class="btn small" id="go">OK</button></div><div id="perr" style="color:var(--red);font-size:12px;margin-top:6px"></div>`;
  document.getElementById("go").onclick=()=>{if(document.getElementById("pin").value===ADMIN_PIN){adminAuthed=true;paintAdmin()}else document.getElementById("perr").textContent=T("wrongPin")};
  return;
 }
 const live=S&&S.active?`${S.trainee} · ${T("q")} ${Math.min(S.done+1,24)}/24 · ${S.score}/120`:"—";
 body.innerHTML=`<h3>${T("live")}</h3><p>${live}</p>
  <h3 style="margin-top:12px">${T("aikey")}</h3>
  <div style="display:flex;gap:6px"><input id="gk" type="password" placeholder="AIza…" value="${getKey()?"••••••••":""}" style="max-width:220px"><button class="btn small" id="gksave">✓</button></div>
  <h3 style="margin-top:12px">${T("results")}</h3>
  ${DB.results.length?`<table><tr><th>${T("name")}</th><th>#</th><th>${T("score")}</th><th></th></tr>
   ${DB.results.map(r=>`<tr><td>${r.trainee}</td><td>${r.attempt}</td><td>${r.score}/120</td><td style="color:${r.pass?"var(--green)":"var(--red)"}">${r.pass?"✓":"✗"}</td></tr>`).join("")}</table>`:`<p style="color:var(--muted)">${T("noresults")}</p>`}
  <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn small" id="csv">${T("csv")}</button>
   ${DB.bypass?`<span style="font-size:12px;color:var(--sand)">🔓 ${T("unlocked")} (${DB.bypass.by})</span>`:`<button class="btn small" id="bp">${T("unlock")}</button>`}</div>
  ${!DB.bypass?`<label>${T("aname")}</label><input id="an" type="text" style="max-width:200px">`:""}
  <h3 style="margin-top:12px">${T("log")}</h3><div class="loglines">${DB.log.slice(-60).reverse().map(l=>`<div>${l}</div>`).join("")}</div>`;
 document.getElementById("gksave").onclick=()=>{const v=document.getElementById("gk").value.trim();
  if(v&&!v.startsWith("•")){localStorage.setItem("adc_gemini_key",v);log("ai key updated");paintAdmin()}};
 const bp=document.getElementById("bp");
 if(bp)bp.onclick=()=>{const nm=(document.getElementById("an").value||"").trim();
  if(!nm){document.getElementById("an").focus();return}
  DB.bypass={by:nm,ts:new Date().toISOString()};log(`gate.bypass · by ${nm}`);save();paintAdmin();
  if(!S||!S.active)showStart()};
 document.getElementById("csv").onclick=()=>{
  const rows=[["trainee","level","attempt","language","score","percent","pass","timestamp"]];
  DB.results.forEach(r=>rows.push([r.trainee,r.level,r.attempt,r.lang,r.score,Math.round(r.score/120*100)+"%",r.pass?"PASS":"FAIL",r.ts]));
  const a=document.createElement("a");
  a.href="data:text/csv;charset=utf-8,﻿"+encodeURIComponent(rows.map(r=>r.join(",")).join("\r\n"));
  a.download="adc_poc3d_results.csv";a.click()};
}

/* ---------- render loop ---------- */
function resize(){if(renderer.xr.isPresenting)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
addEventListener("resize",resize);resize();
// adaptive resolution: drop render scale when frames run slow, restore when fast
const DPR_STEPS=[.8,1,1.25,1.5];
let dprIx=DPR_STEPS.indexOf(1.5),frameAcc=0,frameN=0,dprCool=0;
function dprTick(dt){
 frameAcc+=dt;frameN++;dprCool-=dt;
 if(frameN<60||dprCool>0)return;
 const avg=frameAcc/frameN;frameAcc=0;frameN=0;
 const cap=Math.min(devicePixelRatio,1.5);
 if(avg>.026&&dprIx>0){dprIx--;renderer.setPixelRatio(Math.min(cap,DPR_STEPS[dprIx]));resize();dprCool=2}
 else if(avg<.013&&dprIx<DPR_STEPS.length-1&&DPR_STEPS[dprIx+1]<=cap){dprIx++;renderer.setPixelRatio(DPR_STEPS[dprIx]);resize();dprCool=4}
}
const clock=new THREE.Clock();
function animate(){
 const dt=Math.min(clock.getDelta(),.05);
 const t=clock.elapsedTime;
 const xr=renderer.xr.isPresenting;
 if(!xr)dprTick(dt); // XR manages its own framebuffer scale
 if(window.__dust)window.__dust.rotation.y=t*.011;
 moveTick(dt);fxTick(dt);
 if(xr){
  vrMoveTick(dt);
  rig.position.set(camPos.x,0,camPos.z); // local-floor: the headset supplies eye height
  rig.rotation.set(0,yaw,0);
  vrHoverTick();
 }else{
  rig.position.set(0,0,0);rig.rotation.set(0,0,0);
  camera.position.copy(camPos);
  camera.rotation.set(0,0,0);camera.rotateY(yaw);camera.rotateX(pitch);
  hoverTick();
 }
 saif.position.lerp(new THREE.Vector3(saifTarget.x,0,saifTarget.z),Math.min(1,dt*1.2));
 // follow-me: the trainee walked up to Saif's beacon → the station begins
 if(followSt!=null&&S&&S.active&&!glide&&
    Math.hypot(camPos.x-saifTarget.x,camPos.z-saifTarget.z)<4.2)beginStation(followSt);
 saif.children[1].position.y=2.08+Math.sin(t*2)*.04;
 saif.children[4].intensity=1.4+((saifSpeaking||live.speaking)?Math.sin(t*14)*1.1:0)+Math.sin(t*3)*.25;
 saif.lookAt(camPos.x,1.2,camPos.z);
 stations.forEach((s,i)=>{
  s.group.userData.beam.rotation.y=t*.6;
  s.group.children.forEach(ch=>{if(ch.userData.spin)ch.rotation.y=(ch.userData.baseRy||0)+Math.sin(t*ch.userData.spin*8)*.22});
  if(s.group.userData.orbRing)s.group.userData.orbRing.rotation.z=t*.9;
  if(s.group.userData.globe)s.group.userData.globe.rotation.y=t*.3;
  if(s.group.userData.container){const ph=(t*.18)%1;s.group.userData.container.position.x=-4.1+ph*8.2}
  if(s.group.userData.visitor)s.group.userData.visitor.children[1].position.y=1.95+Math.sin(t*1.6)*.03;
 });
 if(qGroup)qGroup.traverse(m=>{
  // note: no per-frame position "bobbing" on cards — the += version drifted
  // them off their slots and made them shimmer against the deck
  if(m.userData.pulse){const s=1+Math.sin(t*3+m.id)*.16;m.userData.pulse.scale.setScalar(s)}
  if(m.userData.ring)m.userData.ring.rotation.z=t*.8;
 });
 glowTick();
 renderer.render(scene,camera);
}
renderer.setAnimationLoop(animate); // required for WebXR (rAF stops inside a session)
window.__adc={get S(){return S},get qGroup(){return qGroup},get cam(){return camPos},get glide(){return glide},get t(){return clock.elapsedTime},stations};
showStart();
</script>
