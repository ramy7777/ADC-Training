const T=k=>UI[LANG][k];
const L=o=>(LANG==="ar"&&o.ar)?o.ar:o.en;
const PARAMS=new URLSearchParams(location.search);
const FAST=PARAMS.has("fast");
let autoStarted=false;

/* ================= persistence ================= */
const store={get(){try{return JSON.parse(localStorage.getItem("adc_poc3d")||"{}")}catch(e){return{}}},
 set(d){localStorage.setItem("adc_poc3d",JSON.stringify(d))}};
let DB=Object.assign({results:[],log:[],bypass:null},store.get());
function save(){store.set(DB)}
function log(m){DB.log.push(new Date().toISOString().slice(11,19)+" "+m);if(DB.log.length>400)DB.log=DB.log.slice(-400);save();paintAdmin()}

/* ================= assessment engine (identical rules to 2D/VR) ================= */
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function hash(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function shuffled(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const COMBOS=[];for(let a=0;a<6;a++)for(let b=a+1;b<6;b++)for(let c=b+1;c<6;c++)for(let d=c+1;d<6;d++)COMBOS.push([a,b,c,d]);
let S=null;
function draw(attempt){
 const per=[];
 for(const sk of CONTENT.skills){
   const r=rng(S.seed+sk.id*7919);
   const combo=shuffled(COMBOS,r)[(attempt-1)%COMBOS.length];
   const rq=rng(S.seed+sk.id*104729+attempt*31);
   per.push(shuffled(combo.map(i=>sk.questions[i]),rq).map(q=>({q,sk})));
 }
 return per; // 6 stations × 4 beats
}
function widgetOf(q){
 const hasArrow=q.correct.some(c=>c.en.includes("→"));
 if(q.template==="T2"&&hasArrow)return"assign";

/* ---------- canvas-text panels (native Arabic shaping) ---------- */
function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function wrap(x,text,maxw){
 const out=[];
 for(const seg of String(text).split("\n")){
   const words=seg.split(/\s+/);let cur="";
   for(const w of words){const t=cur?cur+" "+w:w;
     if(x.measureText(t).width>maxw&&cur){out.push(cur);cur=w}else cur=t}
   if(cur)out.push(cur);
 }
 return out.slice(0,7);
}
function textTexture(text,{w=512,h=256,size=34,color="#1f2a2e",bg="rgba(255,255,255,0.97)",border="#00736a",pad=24,bold=false}={}){
 const cv=document.createElement("canvas");cv.width=w;cv.height=h;const x=cv.getContext("2d");
 x.fillStyle=bg;roundRect(x,3,3,w-6,h-6,20);x.fill();
 x.strokeStyle=border;x.lineWidth=4;roundRect(x,3,3,w-6,h-6,20);x.stroke();
 x.fillStyle=color;x.font=`${bold?"700":"500"} ${size}px "Segoe UI",Tahoma`;
 x.textAlign="center";x.textBaseline="middle";x.direction=LANG==="ar"?"rtl":"ltr";
 const lines=wrap(x,text,w-pad*2);
 const lh=size*1.25,y0=h/2-(lines.length-1)*lh/2;
 lines.forEach((ln,i)=>x.fillText(ln,w/2,y0+i*lh));
 const t=new THREE.CanvasTexture(cv);t.anisotropy=4;t.colorSpace=THREE.SRGBColorSpace;return t;
}
function textPanel(text,wm,hm,opts={}){
 const px=Math.round(wm*256),py=Math.round(hm*256);
 const m=new THREE.Mesh(new THREE.PlaneGeometry(wm,hm),
   new THREE.MeshBasicMaterial({map:textTexture(text,Object.assign({w:px,h:py},opts)),transparent:true,side:THREE.DoubleSide}));
 m.userData.setText=(t,o={})=>{m.material.map=textTexture(t,Object.assign({w:px,h:py},opts,o));m.material.needsUpdate=true};
 return m;
}

const ray=new THREE.Raycaster();const mouse=new THREE.Vector2();
let clicks=[],drags=[],dropTargets=[];
function setInteract(c,d,z){clicks=c||[];drags=d||[];dropTargets=z||[]}
let hovered=null;
let looking=false,lookMoved=0;
let drag=null; // {obj, plane, home, t}
const flights=[]; // {obj,to,vel?,fade?,t,dur,remove}
function flyBack(obj,to){flights.push({obj,to:to.clone(),t:0,dur:.35})}

function pointerNDC(e){mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1}
canvas.addEventListener("pointerdown",e=>{
 pointerNDC(e);
 ray.setFromCamera(mouse,camera);
 const dh=ray.intersectObjects(drags,false);
 if(dh.length){
   const o=dh[0].object;
   drag={obj:o,plane:new THREE.Plane(),home:o.userData.home||o.position.clone()};
   o.userData.home=drag.home;
   const n=new THREE.Vector3();camera.getWorldDirection(n);
   drag.plane.setFromNormalAndCoplanarPoint(n,o.position);
   o.scale.setScalar((o.userData.baseScale||1)*1.12);
   canvas.setPointerCapture(e.pointerId);
   return;
 }
 looking=true;lookMoved=0;
});
canvas.addEventListener("pointermove",e=>{
 pointerNDC(e);
 if(drag){
   ray.setFromCamera(mouse,camera);
   const p=new THREE.Vector3();
   if(ray.ray.intersectPlane(drag.plane,p)){drag.obj.position.lerp(p,.55)}
   // highlight hovered drop target
   const zh=ray.intersectObjects(dropTargets,false);
   dropTargets.forEach(z=>{if(z.userData.setHot)z.userData.setHot(zh.length&&zh[0].object===z)});
   return;
 }
 if(looking){yaw-=e.movementX*.0032;pitch=Math.max(-1.2,Math.min(1.2,pitch-e.movementY*.0032));lookMoved+=Math.abs(e.movementX)+Math.abs(e.movementY)}
});
addEventListener("pointerup",e=>{
 if(drag){
   const o=drag.obj;o.scale.setScalar(o.userData.baseScale||1);
   ray.setFromCamera(mouse,camera);
   const zh=ray.intersectObjects(dropTargets,false);
   dropTargets.forEach(z=>{if(z.userData.setHot)z.userData.setHot(false)});
   let accepted=false;
   if(zh.length&&zh[0].object.userData.onDrop)accepted=zh[0].object.userData.onDrop(o)!==false;
   if(!accepted){flyBack(o,drag.home);if(o.userData.onReturn)o.userData.onReturn(o)}
   drag=null;return;
 }
 const was=looking;looking=false;
 if(was&&lookMoved<6)clickRay();
});
function clickRay(){
 ray.setFromCamera(mouse,camera);
 const hits=ray.intersectObjects(clicks,false);
 if(hits.length){const o=hits[0].object;if(o.userData.onClick)o.userData.onClick(o)}
}
function hoverTick(){
 if(drag)return;
 const all=clicks.concat(drags);
 if(!all.length){document.body.style.cursor=looking?"grabbing":"default";return}
 ray.setFromCamera(mouse,camera);
 const hits=ray.intersectObjects(all,false);
 const o=hits.length?hits[0].object:null;
 if(hovered&&hovered!==o)hovered.scale.setScalar(hovered.userData.baseScale||1);
 hovered=o;
 if(o){o.userData.baseScale=o.userData.baseScale||o.scale.x;o.scale.setScalar((o.userData.baseScale||1)*1.07);document.body.style.cursor=drags.includes(o)?"grab":"pointer"}

}

    if(b.t>1){scene.remove(b.pts);bursts.splice(i,1)}}
  else if(b.chip){b.chip.position.y+=dt*.9;b.chip.material.opacity=Math.max(0,1-b.t*.8);b.chip.lookAt(camPos);
    if(b.t>1.4){scene.remove(b.chip);bursts.splice(i,1)}}}
 for(let i=flights.length-1;i>=0;i--){const f=flights[i];f.t+=dt/f.dur;
  if(f.t>=1){f.obj.position.copy(f.to);flights.splice(i,1)}
  else f.obj.position.lerp(f.to,Math.min(1,dt*9))}
}

/* ================= question staging ================= */
let qGroup=null;
function clearQ(){if(qGroup){scene.remove(qGroup);qGroup=null}setInteract([],[],[]);
 document.getElementById("conv").style.display="none";document.getElementById("convstat").style.display="none";
 document.getElementById("spacehint").style.display="none"}
function stageBase(i){
 clearQ();
 qGroup=new THREE.Group();
 const st=stations[i];
 qGroup.position.copy(st.pos);
 qGroup.quaternion.copy(st.group.quaternion);
 scene.add(qGroup);
 return qGroup;
}
function cardMesh(text,w,h){const m=textPanel(text,w,h,{size:40});m.userData.isCard=true;return m}
function arcPlace(meshes,y=2.1,rad=3.9,z=-2.2){
 const n=meshes.length;
 meshes.forEach((m,k)=>{const a=(k-(n-1)/2)*Math.max(.3,.5-n*.02);
  m.position.set(Math.sin(a)*rad,y+((k%2)*.16),z+(1-Math.cos(a))*1.3);
  m.rotation.y=-a*.4;m.userData.home=m.position.clone();qGroup.add(m)});
}
function score(q,ok,fxAt){
 if(ok)S.score+=5;
 S.answers.push({id:q.id,ok});
 S.done++;
 beep(ok);flash(ok);hud();
 if(fxAt){const wp=fxAt.clone();qGroup&&qGroup.localToWorld(wp);burst(wp,ok)}
 subtitle(T("saif"),ok?T("correct"):T("wrong"));
 log(`answer · ${q.id} · ${ok?"+5":"0"} · ${S.score}/120`);
}
/* the answer pad: a glowing pedestal that accepts dragged cards */
function makePad(g,label,wide){
 const grp=new THREE.Group();
 const base=new THREE.Mesh(new THREE.CylinderGeometry(wide?2.1:1.15,wide?2.25:1.3,.22,40),mat(0xffffff));
 base.position.y=.11;grp.add(base);
 const glowRing=new THREE.Mesh(new THREE.TorusGeometry(wide?2.1:1.15,.045,10,60),mat(TEAL,TEAL,1));
 glowRing.rotation.x=Math.PI/2;glowRing.position.y=.24;grp.add(glowRing);
 grp.userData.ring=glowRing;
 const lbl=textPanel(label,wide?4.2:3.2,.62,{size:30,bold:true,color:"#00736a",bg:"rgba(255,255,255,0.92)",border:"rgba(0,115,106,0.35)"});
 lbl.position.set(0,1.55,0);grp.add(lbl);grp.userData.lbl=lbl;
 // invisible generous catch surface for drops
 const catcher=new THREE.Mesh(new THREE.CylinderGeometry(wide?2.5:1.7,wide?2.5:1.7,2.6,20),
   new THREE.MeshBasicMaterial({visible:false}));
 catcher.position.y=1.3;grp.add(catcher);
 catcher.userData.setHot=h=>{glowRing.material.emissiveIntensity=h?2.2:1;glowRing.scale.setScalar(h?1.06:1)};
 g.add(grp);
 return {grp,catcher};
}
function playBeat(stIdx,q,onDone){
 const w=widgetOf(q);
 const dis=realDis(q);
 speak(L(q.prompt));
 if(w==="conv"){stageConv(stIdx,q,onDone);return}
 const g=stageBase(stIdx);
 const finish=(ok,at)=>{score(q,ok,at);setTimeout(()=>onDone(),1100)};

 if(w==="single"||w==="multi"){
   /* -------- drag cards onto the answer pad -------- */
   const items=shuffled(q.correct.concat(dis),rng(S.seed+hash(q.id)));
   const pad=makePad(g,w==="single"?T("padPlace"):T("padCollect"),w==="multi");
   pad.grp.position.set(0,0,1.1);
   const onPad=new Set();
   const cards=items.map((o,ix)=>{const m=cardMesh(L(o),2.5,1.15);m.userData.ix=ix;return m});
   arcPlace(cards,2.2,4.2,-2.4);
   const relayout=()=>{ // arrange cards resting on the pad
     const on=[...onPad];
     on.forEach((ix,k)=>{const m=cards.find(c=>c.userData.ix===ix);
       const a=(k-(on.length-1)/2)*.75;
       flyBack(m,new THREE.Vector3(pad.grp.position.x+a,1.05+Math.abs(a)*.02,pad.grp.position.z));
       m.userData.onPad=true});
   };
   let confirmBtn=null;
   if(w==="multi"){
     confirmBtn=textPanel(T("confirm"),1.9,.72,{size:40,bold:true,color:"#ffffff",bg:"rgba(0,115,106,0.96)",border:"#005a53"});
     confirmBtn.position.set(3.2,1.1,1.1);confirmBtn.visible=false;g.add(confirmBtn);
     confirmBtn.userData.onClick=()=>{
       const chosen=[...onPad].map(i=>items[i].en).sort();
       const want=q.correct.map(c=>c.en).sort();
       finish(chosen.length===want.length&&chosen.every((v,i)=>v===want[i]),pad.grp.position.clone().add(new THREE.Vector3(0,1,0)));
     };
   }
   pad.catcher.userData.onDrop=o=>{
     if(w==="single"){
       flyBack(o,new THREE.Vector3(pad.grp.position.x,1.05,pad.grp.position.z));
       setInteract([],[],[]);
       setTimeout(()=>finish(q.correct.some(c=>c.en===items[o.userData.ix].en),pad.grp.position.clone().add(new THREE.Vector3(0,1,0))),450);
       return true;
     }
     onPad.add(o.userData.ix);relayout();
     confirmBtn.visible=onPad.size>0;
     return true;
   };
   // dragging a card off the pad removes it (multi only)
   const offDrop=o=>{if(o.userData.onPad){onPad.delete(o.userData.ix);o.userData.onPad=false;flyBack(o,o.userData.home);relayout();confirmBtn&&(confirmBtn.visible=onPad.size>0);return true}return false};
   const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshBasicMaterial({visible:false}));
   ground.rotation.x=-Math.PI/2;ground.position.y=.05;g.add(ground);
   ground.userData.onDrop=offDrop;
   setInteract(confirmBtn?[confirmBtn]:[],cards,[pad.catcher,ground]);

 }else if(w==="sequence"){
   /* -------- touch panels in order; a light path follows -------- */
   const items=shuffled(q.correct.concat(dis),rng(S.seed+hash(q.id)));
   const hint=textPanel(T("seqHint"),6.4,.62,{size:28,color:"#61707a",bg:"rgba(255,255,255,0.85)",border:"rgba(0,0,0,0)"});
   hint.position.set(0,.55,0);g.add(hint);
   const seq=[];
   const cards=items.map((o,ix)=>{const m=cardMesh(L(o),2.3,1.05);
     m.userData.onClick=()=>{if(seq.includes(ix))return;
       seq.push(ix);
       m.userData.setText(seq.length+". "+L(o),{border:"#1fa877",bg:"rgba(234,250,244,0.97)"});
       beep(true);
       if(seq.length>1){ // draw glowing link from previous card
         const a=cards[seq[seq.length-2]].position,b=m.position;
         const mid=a.clone().add(b).multiplyScalar(.5);
         const len=a.distanceTo(b);
         const tube=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,len,10),
           new THREE.MeshBasicMaterial({color:TEALL,transparent:true,opacity:.85}));
         tube.position.copy(mid);tube.lookAt(b.clone().add(qGroup.position));
         tube.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.clone().sub(a).normalize());
         g.add(tube);
       }
       if(seq.length===q.correct.length){
         const chosen=seq.map(i=>items[i].en);const want=q.correct.map(c=>c.en);
         setTimeout(()=>finish(chosen.every((v,i)=>v===want[i]),m.position.clone()),400);
       }};
     return m});
   arcPlace(cards,2.3,4.2,-2.6);
   setInteract(cards,[],[]);

 }else if(w==="hotsingle"||w==="hotmulti"){
   /* -------- hotspots on an image board (map / wall) -------- */
   const isMap=/map/i.test(q.prompt.en)||q.id==="S1-Q4";
   const board=new THREE.Mesh(new THREE.PlaneGeometry(7.6,4.3),new THREE.MeshBasicMaterial({color:0xffffff}));
   board.position.set(0,2.55,-3.4);g.add(board);
   const frame=new THREE.Mesh(new THREE.BoxGeometry(7.9,4.6,.08),mat(TEAL,TEAL,.35));
   frame.position.set(0,2.55,-3.46);g.add(frame);
   if(isMap)loadTex("img/uae-map.jpg",t=>{board.material.map=t;board.material.needsUpdate=true});
   const hint=textPanel(T("hotHint"),6.4,.62,{size:28,color:"#61707a",bg:"rgba(255,255,255,0.85)",border:"rgba(0,0,0,0)"});
   hint.position.set(0,.5,-.6);g.add(hint);
   const items=shuffled(q.correct.concat(dis),rng(S.seed+hash(q.id)));
   // stable spread across the board
   const spots=shuffled(items.map((_,k)=>k),rng(S.seed+hash(q.id+"pos")));
   const cols=Math.ceil(items.length/2);
   const sel=new Set();
   let confirmBtn=null;
   const markers=items.map((o,ix)=>{
     const slot=spots[ix];
     const cx=((slot%cols)-(cols-1)/2)*(6.6/cols);
     const cy=slot<cols?3.35:1.9;
     const grpM=new THREE.Group();
     const ringM=new THREE.Mesh(new THREE.RingGeometry(.14,.22,32),new THREE.MeshBasicMaterial({color:TEAL,transparent:true,opacity:.95,side:THREE.DoubleSide}));
     grpM.add(ringM);grpM.userData.pulse=ringM;
     const dot=new THREE.Mesh(new THREE.CircleGeometry(.09,20),new THREE.MeshBasicMaterial({color:TEAL}));
     dot.position.z=.005;grpM.add(dot);
     const lbl=textPanel(L(o),2.15,.72,{size:26});
     lbl.position.set(0,-.62,.01);grpM.add(lbl);
     grpM.position.set(cx,cy,-3.32);
     g.add(grpM);
     dot.userData.hitIx=ix;
     lbl.userData.hitIx=ix;
     const toggle=()=>{
       if(w==="hotsingle"){setInteract([],[],[]);
         setTimeout(()=>finish(q.correct.some(c=>c.en===items[ix].en),grpM.position.clone()),350);return}
       sel.has(ix)?sel.delete(ix):sel.add(ix);
       const on=sel.has(ix);
       ringM.material.color.set(on?SAND:TEAL);dot.material.color.set(on?SAND:TEAL);
       lbl.userData.setText((on?"● ":"")+L(o),{border:on?"#c8a45a":"#00736a"});
       confirmBtn.visible=sel.size>0;
     };
     dot.userData.onClick=toggle;lbl.userData.onClick=toggle;
     return {dot,lbl};
   });
   const clickables=markers.flatMap(m=>[m.dot,m.lbl]);
   if(w==="hotmulti"){
     confirmBtn=textPanel(T("confirm"),1.9,.72,{size:40,bold:true,color:"#ffffff",bg:"rgba(0,115,106,0.96)",border:"#005a53"});
     confirmBtn.position.set(3.4,1.1,-1.4);confirmBtn.visible=false;g.add(confirmBtn);
     confirmBtn.userData.onClick=()=>{
       const chosen=[...sel].map(i=>items[i].en).sort();
       const want=q.correct.map(c=>c.en).sort();
       finish(chosen.length===want.length&&chosen.every((v,i)=>v===want[i]),new THREE.Vector3(0,2.5,-3.2));
     };
     clickables.push(confirmBtn);
   }
   setInteract(clickables,[],[]);

 }else{ /* -------- assign: drag cards onto zone boards -------- */
   const cardsData=q.correct.concat(dis).map(o=>{const pe=o.en.split("→").map(s=>s.trim());
     const pa=(o.ar||o.en).split("→").map(s=>s.trim());
     return{en:pe[0],ar:pa[0]||pe[0],zoneEn:/matches nothing/i.test(pe[1]||"")?"__none__":(pe[1]||""),zoneAr:pa[1]||""}});
   const zones=[];cardsData.forEach(c=>{if(c.zoneEn!=="__none__"&&!zones.some(z=>z.en===c.zoneEn))zones.push({en:c.zoneEn,ar:c.zoneAr})});
   if(cardsData.some(c=>c.zoneEn==="__none__"))zones.push({en:"__none__",ar:""});
   const order=shuffled(cardsData.map((c,i)=>i),rng(S.seed+hash(q.id)));
   const assign={};
   const zlabel=z=>z.en==="__none__"?T("notUsed"):(LANG==="ar"&&z.ar?z.ar:z.en);
   // draggable cards up high
   const cardM=order.map(ci=>{const c=cardsData[ci];const m=cardMesh(LANG==="ar"?c.ar:c.en,2.3,.95);
     m.userData.ci=ci;
     m.userData.onReturn=o=>{ // dragged off a zone and dropped nowhere: unassign
       const prev=assign[o.userData.ci];
       if(prev!=null){delete assign[o.userData.ci];
         const pz=zoneM[prev];pz.grpZ.userData.stack=pz.grpZ.userData.stack.filter(x=>x!==o);restack(pz);
         o.scale.setScalar(1);o.userData.baseScale=1}
     };
     return m});
   arcPlace(cardM,3.1,4.4,-2.9);
   // zone boards standing in a row
   const zw=2.9;
   const zoneM=zones.map((z,zi)=>{
     const grpZ=new THREE.Group();
     const back=new THREE.Mesh(new THREE.BoxGeometry(zw,2.5,.1),mat(0xffffff));
     back.position.y=1.25;grpZ.add(back);
     const head=textPanel(zlabel(z),zw-.15,.62,{size:30,bold:true,color:"#ffffff",bg:"rgba(0,115,106,0.96)",border:"#005a53"});
     head.position.set(0,2.22,.07);grpZ.add(head);
     const slotsLbl=textPanel(T("dropZone"),zw-.5,.5,{size:24,color:"#9aa7ad",bg:"rgba(244,247,248,0.9)",border:"rgba(0,0,0,0)"});
     slotsLbl.position.set(0,1.0,.07);grpZ.add(slotsLbl);grpZ.userData.slotsLbl=slotsLbl;
     grpZ.position.set(-((zones.length-1)/2)*(zw+.35)+zi*(zw+.35),0,-.9);
     g.add(grpZ);
     back.userData.zi=zi;grpZ.userData.stack=[];
     back.userData.setHot=h=>{back.material.emissive=new THREE.Color(h?TEAL:0x000000);back.material.emissiveIntensity=h?.35:0};
     back.userData.onDrop=o=>{
       const prev=assign[o.userData.ci];
       if(prev!=null){const pz=zoneM[prev];pz.grpZ.userData.stack=pz.grpZ.userData.stack.filter(x=>x!==o);restack(pz)}
       assign[o.userData.ci]=zi;
       grpZ.userData.stack.push(o);restack({grpZ,back});
       grpZ.userData.slotsLbl.visible=false;
       if(Object.keys(assign).length===cardsData.length){
         setInteract([],[],[]);
         setTimeout(()=>{
           const ok=cardsData.every((c,ci)=>{const z=zones[assign[ci]];return z&&(c.zoneEn==="__none__"?z.en==="__none__":z.en===c.zoneEn)});
           finish(ok,grpZ.position.clone().add(new THREE.Vector3(0,1.6,0)));
         },500);
       }
       return true;
     };
     return {grpZ,back};
   });
   function restack(z){
     z.grpZ.userData.stack.forEach((m,k)=>{
       m.scale.setScalar(.72);m.userData.baseScale=.72;
       flyBack(m,z.grpZ.position.clone().add(new THREE.Vector3(0,1.72-k*.55,.14)));
     });
     if(!z.grpZ.userData.stack.length&&z.grpZ.userData.slotsLbl)z.grpZ.userData.slotsLbl.visible=true;
   }
   setInteract([],cardM,zoneM.map(z=>z.back));
 }
}

/* ---------- conversational beat + push-to-talk ---------- */
let recog=null,recActive=false,convOpen=false,curSubmit=null;
function recStart(){
 if(recActive||!convOpen)return;
 const stat=document.getElementById("convstat");
 const talk=document.getElementById("talk");
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){stat.style.display="block";stat.textContent=T("mic_no");return}
 if(!window.isSecureContext){stat.style.display="block";stat.textContent=T("mic_ctx");return}
 try{
   recog=new SR();recog.lang=LANG==="ar"?"ar-SA":"en-US";recog.interimResults=false;
   recog.onresult=ev=>{const tx=ev.results[0][0].transcript;if(curSubmit)curSubmit(tx)};
   recog.onerror=e=>{stat.style.display="block";stat.textContent=T("mic_no")+" ("+e.error+")";talk.classList.remove("rec");recActive=false};
   recog.onend=()=>{talk.classList.remove("rec");recActive=false};
   recog.start();recActive=true;
   talk.classList.add("rec");
   stat.style.display="block";stat.textContent=T("listening");
 }catch(e){stat.style.display="block";stat.textContent=T("mic_no")}
}
function recStop(){try{recog&&recog.stop()}catch(e){};document.getElementById("talk").classList.remove("rec");recActive=false}
function pttDown(){if(convOpen)recStart()}
function pttUp(){if(convOpen)recStop()}

function stageConv(stIdx,q,onDone){
 stageBase(stIdx);
 const conv=document.getElementById("conv");
 const stat=document.getElementById("convstat");
 const sp=document.getElementById("spacehint");
 const who=q.id==="S5-Q3"?T("visitor"):T("saif");
 subtitle(who,L(q.prompt),true);
 document.getElementById("convopts").textContent=T("showOpts");
 document.getElementById("convin").value="";
 document.getElementById("convin").placeholder=T("typeHint");
 const cleanup=()=>{conv.style.display="none";stat.style.display="none";sp.style.display="none";convOpen=false;curSubmit=null};
 const fallback=()=>{cleanup();
   const dis=realDis(q);const items=shuffled(q.correct.concat(dis),rng(S.seed+hash(q.id)));
   const cards=items.map((o,ix)=>{const m=cardMesh(L(o),2.7,1.2);
     m.userData.onClick=()=>{score(q,q.correct.some(c=>c.en===items[ix].en),m.position.clone());setTimeout(()=>onDone(),1100)};return m});
   arcPlace(cards);setInteract(cards,[],[])};
 if(!getKey()){subtitle(who,L(q.prompt),true);stat.style.display="block";stat.textContent=T("key_no");setTimeout(fallback,50);return}
 conv.style.display="flex";convOpen=true;
 stat.style.display="block";stat.textContent=T("typeHint");
 sp.style.display="block";sp.textContent=T("holdSpace");
 const finish=(ok)=>{cleanup();score(q,ok);setTimeout(()=>onDone(),1100)};
 const submit=async(text)=>{
   if(!text||!text.trim())return;
   subtitle(T("you"),text);
   stat.textContent=T("judging");
   conv.style.display="none";sp.style.display="none";
   try{
     const v=await judgeAnswer(q,text.trim());
     stat.style.display="none";
     speak(v.feedback,T("saif"));
     finish(!!v.correct);
   }catch(e){stat.textContent=T("ai_no");log("gemini error: "+e.message);setTimeout(fallback,900)}
 };
 curSubmit=submit;
 document.getElementById("convsend").onclick=()=>submit(document.getElementById("convin").value);
 document.getElementById("convin").onkeydown=e=>{if(e.key==="Enter")submit(e.target.value)};
 document.getElementById("convopts").onclick=fallback;
 const talk=document.getElementById("talk");
 talk.onpointerdown=recStart;
 talk.onpointerup=recStop;
 talk.onpointerleave=()=>{if(recActive)recStop()};
}

/* ================= session flow ================= */
function startSession(name){
 const prev=DB.results.filter(r=>r.trainee===name&&r.level===1).length;
 S={trainee:name,seed:hash(name+"|adc-poc"),attempt:prev+1,score:0,done:0,answers:[],active:true,st:0};
 S.plan=draw(S.attempt);
 log(`session.start · ${name} · ${LANG} · attempt ${S.attempt}`);
 document.getElementById("startOv").style.display="none";
 document.getElementById("ctrlhint").textContent=T("hint");
 hud();
 runStation(0);
}
function runStation(i){
 S.st=i;
 stations.forEach((s,k)=>{s.group.userData.beam.visible=k===i});
 const a=stationAngle(i);
 saifTarget=new THREE.Vector3(Math.sin(a)*(R-5.4)+Math.cos(a)*1.8,0,-Math.cos(a)*(R-5.4)+Math.sin(a)*1.8);
 glideTo(i);
 speak(T("stationIntro")[i]);
 setTimeout(()=>runBeat(i,0),FAST?350:2600);
}
function runBeat(i,b){
 if(b>=4){ if(i+1<6)runStation(i+1); else endLevel(); return }
 const {q}=S.plan[i][b];
 playBeat(i,q,()=>runBeat(i,b+1));
}
function endLevel(){
 clearQ();
 const pass=S.score>=96;
 DB.results.push({trainee:S.trainee,level:1,attempt:S.attempt,score:S.score,pass,lang:LANG,ts:new Date().toISOString(),answers:S.answers});
 save();log(`level.result · ${S.trainee} · ${S.score}/120 · ${pass?"PASS":"FAIL"}`);
 S.active=false;hud();
 document.getElementById("roEyebrow").textContent=T("eyebrow");
 document.getElementById("roScore").textContent=S.score+" / 120";
 document.getElementById("roScore").className="big "+(pass?"pass":"fail");
 document.getElementById("roVerdict").textContent=pass?T("passed"):T("failed");
 document.getElementById("roVerdict").className=pass?"pass":"fail";
 const rr=document.getElementById("roRetry");
 rr.style.display=pass?"none":"";rr.textContent=T("retry");
 rr.onclick=()=>{document.getElementById("resultOv").style.display="none";startSession(S.trainee)};
 document.getElementById("roHome").textContent=T("home");
 document.getElementById("roHome").onclick=()=>{document.getElementById("resultOv").style.display="none";showStart()};
 document.getElementById("resultOv").style.display="flex";
}

/* ---------- start overlay ---------- */
function lvState(n){
 if(n===1)return"open";
 const passed=DB.results.some(r=>r.pass&&r.level===1);
 if(n===2&&(passed||DB.bypass))return DB.bypass&&!passed?"bypassed":"open";
 return"locked";
}
function showStart(){
 if(PARAMS.has("autostart")&&!autoStarted){
   autoStarted=true;
   LANG=PARAMS.get("lang")==="ar"?"ar":"en";
   document.documentElement.dir=LANG==="ar"?"rtl":"ltr";
   document.getElementById("startOv").style.display="none";
   startSession(PARAMS.get("name")||"Demo");
   return;
 }
 const so=document.getElementById("startOv");so.style.display="flex";
 document.getElementById("soEyebrow").textContent=T("eyebrow");
 document.getElementById("bcSub").textContent=T("eyebrow");
 document.getElementById("soTitle").textContent=T("title");
 document.getElementById("soDesc").textContent=T("desc");
 document.getElementById("soNameL").textContent=T("name");
 document.getElementById("soLangL").textContent=T("lang");
 document.getElementById("soLvlL").textContent=T("lvl");
 document.getElementById("soHint").textContent=T("hint");
 document.getElementById("inName").value=DB.lastName||"";
 const g=document.getElementById("lvGrid");
 g.innerHTML=[1,2,3,4,5].map(n=>{const st=lvState(n);
  return`<div class="level ${st}" data-lv="${n}"><div class="num">${n}</div><div class="st">${st==="locked"?"🔒 "+T("locked"):(st==="bypassed"?"🔓":T("open"))}</div></div>`}).join("");
 g.querySelectorAll(".level.open,.level.bypassed").forEach(el=>el.onclick=()=>{
   const nm=document.getElementById("inName").value.trim();
   if(!nm){document.getElementById("inName").focus();return}
   DB.lastName=nm;save();
   if(+el.dataset.lv===1){so.style.display="none";startSession(nm)}
   else{so.style.display="none";subtitle(T("saif"),T("l2"));setTimeout(showStart,4200)}
 });
}
document.querySelectorAll(".langbtn").forEach(b=>b.onclick=()=>{
 LANG=b.dataset.l;
 document.documentElement.dir=LANG==="ar"?"rtl":"ltr";
 document.querySelectorAll(".langbtn").forEach(x=>x.classList.toggle("sel",x===b));
 showStart();
});

/* ---------- ask Saif ---------- */
function toggleAsk(on){const r=document.getElementById("askrow");
 r.style.display=on?"flex":"none";
 if(on){const i=document.getElementById("askin");i.placeholder=T("askPh");i.focus()}}
document.getElementById("btnAsk").onclick=()=>toggleAsk(true);
document.getElementById("askclose").onclick=()=>toggleAsk(false);
async function doAsk(){const i=document.getElementById("askin");const t=i.value.trim();if(!t)return;
 i.value="";subtitle(T("you"),t);
 try{const r=await askSaif(t);speak(r.trim(),T("saif"))}catch(e){subtitle(T("saif"),e.message==="nokey"?T("key_no"):T("ai_no"))}}
document.getElementById("asksend").onclick=doAsk;
document.getElementById("askin").addEventListener("keydown",e=>{if(e.key==="Enter")doAsk()});

/* ---------- admin ---------- */
let adminAuthed=false;
document.getElementById("btnAdmin").onclick=()=>{document.getElementById("drawer").classList.add("open");paintAdmin()};
document.getElementById("dClose").onclick=()=>document.getElementById("drawer").classList.remove("open");
function paintAdmin(){
 if(!document.getElementById("drawer").classList.contains("open"))return;
 const body=document.getElementById("dBody");
 if(!adminAuthed){
  body.innerHTML=`<label>${T("pin")}</label><input id="pin" type="password" style="max-width:150px">
   <div style="margin-top:10px"><button class="btn small" id="go">OK</button></div><div id="perr" style="color:var(--red);font-size:12px;margin-top:6px"></div>`;
  document.getElementById("go").onclick=()=>{if(document.getElementById("pin").value===ADMIN_PIN){adminAuthed=true;paintAdmin()}else document.getElementById("perr").textContent=T("wrongPin")};
  return;
 }
 const live=S&&S.active?`${S.trainee} · ${T("q")} ${Math.min(S.done+1,24)}/24 · ${S.score}/120`:"—";
 body.innerHTML=`<h3>${T("live")}</h3><p>${live}</p>
  <h3 style="margin-top:12px">${T("aikey")}</h3>
  <div style="display:flex;gap:6px"><input id="gk" type="password" placeholder="AIza…" value="${getKey()?"••••••••":""}" style="max-width:220px"><button class="btn small" id="gksave">✓</button></div>
  <h3 style="margin-top:12px">${T("results")}</h3>
  ${DB.results.length?`<table><tr><th>${T("name")}</th><th>#</th><th>${T("score")}</th><th></th></tr>
   ${DB.results.map(r=>`<tr><td>${r.trainee}</td><td>${r.attempt}</td><td>${r.score}/120</td><td style="color:${r.pass?"var(--green)":"var(--red)"}">${r.pass?"✓":"✗"}</td></tr>`).join("")}</table>`:`<p style="color:var(--muted)">${T("noresults")}</p>`}
  <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn small" id="csv">${T("csv")}</button>
   ${DB.bypass?`<span style="font-size:12px;color:var(--sand)">🔓 ${T("unlocked")} (${DB.bypass.by})</span>`:`<button class="btn small" id="bp">${T("unlock")}</button>`}</div>
  ${!DB.bypass?`<label>${T("aname")}</label><input id="an" type="text" style="max-width:200px">`:""}
  <h3 style="margin-top:12px">${T("log")}</h3><div class="loglines">${DB.log.slice(-60).reverse().map(l=>`<div>${l}</div>`).join("")}</div>`;
 document.getElementById("gksave").onclick=()=>{const v=document.getElementById("gk").value.trim();
  if(v&&!v.startsWith("•")){localStorage.setItem("adc_gemini_key",v);log("ai key updated");paintAdmin()}};
 const bp=document.getElementById("bp");
 if(bp)bp.onclick=()=>{const nm=(document.getElementById("an").value||"").trim();
  if(!nm){document.getElementById("an").focus();return}
  DB.bypass={by:nm,ts:new Date().toISOString()};log(`gate.bypass · by ${nm}`);save();paintAdmin();
  if(!S||!S.active)showStart()};
 document.getElementById("csv").onclick=()=>{
  const rows=[["trainee","level","attempt","language","score","percent","pass","timestamp"]];
  DB.results.forEach(r=>rows.push([r.trainee,r.level,r.attempt,r.lang,r.score,Math.round(r.score/120*100)+"%",r.pass?"PASS":"FAIL",r.ts]));
  const a=document.createElement("a");
  a.href="data:text/csv;charset=utf-8,﻿"+encodeURIComponent(rows.map(r=>r.join(",")).join("\r\n"));
  a.download="adc_poc3d_results.csv";a.click()};
}

/* ---------- render loop ---------- */
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
addEventListener("resize",resize);resize();
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 const t=clock.elapsedTime;
 moveTick(dt);hoverTick();fxTick(dt);
 camera.position.copy(camPos);
 camera.rotation.set(0,0,0);camera.rotateY(yaw);camera.rotateX(pitch);
 saif.position.lerp(new THREE.Vector3(saifTarget.x,0,saifTarget.z),Math.min(1,dt*2));
 saif.children[1].position.y=2.08+Math.sin(t*2)*.04;
 saif.children[4].intensity=1.4+(saifSpeaking?Math.sin(t*14)*1.1:0)+Math.sin(t*3)*.25;
 saif.lookAt(camPos.x,1.2,camPos.z);
 stations.forEach((s,i)=>{
  s.group.userData.beam.rotation.y=t*.6;
  s.group.children.forEach(ch=>{if(ch.userData.spin)ch.rotation.y=Math.sin(t*ch.userData.spin*8)*.22});
  if(s.group.userData.container){const ph=(t*.18)%1;s.group.userData.container.position.x=-4.1+ph*8.2}
  if(s.group.userData.visitor)s.group.userData.visitor.children[1].position.y=1.95+Math.sin(t*1.6)*.03;
 });
 if(qGroup)qGroup.traverse(m=>{
  if(m.userData.isCard&&!drag||m.userData.isCard&&drag&&drag.obj!==m)m.position.y+=Math.sin(t*1.4+m.id)*.0008;
  if(m.userData.pulse){const s=1+Math.sin(t*3+m.id)*.16;m.userData.pulse.scale.setScalar(s)}
  if(m.userData.ring)m.userData.ring.rotation.z=t*.8;
 });
 renderer.render(scene,camera);
}
animate();
window.__adc={get S(){return S},get qGroup(){return qGroup},get cam(){return camPos},get glide(){return glide},get t(){return clock.elapsedTime},stations};
showStart();
</script>
